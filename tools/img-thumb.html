<h1 class="tool-title" style="margin-bottom:6px">生成缩略图</h1>

<div id="app"></div>
<div class="rel"><h4>同类工具</h4><div class="grid"><a class="card" href="img-resize.html"><div class="card-t"><span class="card-name">图片改尺寸</span></div><div class="card-desc">按指定宽高重绘，高度留 0 自动按比例。</div></a><a class="card" href="img-format.html"><div class="card-t"><span class="card-name">图片格式转换</span></div><div class="card-desc">PNG / JPEG / WEBP 互转，点保存图片下载。</div></a><a class="card" href="img-compress.html"><div class="card-t"><span class="card-name">图片压缩</span></div><div class="card-desc">降低质量压缩体积，可同时限制最大边。</div></a><a class="card" href="img-rotate.html"><div class="card-t"><span class="card-name">图片旋转</span></div><div class="card-desc">顺时针 90/180/270 度旋转。</div></a><a class="card" href="img-flip.html"><div class="card-t"><span class="card-name">图片翻转</span></div><div class="card-desc">水平或垂直镜像。</div></a><a class="card" href="img-gray.html"><div class="card-t"><span class="card-name">图片转灰度</span></div><div class="card-desc">去色为黑白灰阶。</div></a></div></div>

<script src="../assets/runtime.js"></script>
<script>
/* ============================================================
   15-image.js — 图片处理（全部浏览器本地 canvas 处理，零上传）
   ============================================================ */

  var H = {
    getCtx: function (c) { return c.getContext('2d'); },
    drawResize: function (img, w, h) {
      var c = RT.mkCanvas(w, h);
      H.getCtx(c).drawImage(img, 0, 0, w, h);
      return c;
    },
    px: function (img) { return H.getCtx(img).getImageData(0, 0, img.width, img.height); }
  };
  
window.TOOL = { id: "img-thumb", n: "生成缩略图", c: "image", d: "按最长边缩放成缩略图。",
  custom: null,
  fields: [{"k":"file","t":"图片","type":"file","accept":"image/*"},{"k":"max","t":"最长边","type":"number","v":200},{"k":"outimg","t":"预览","type":"outimg"}],
  auto: true,
  first: true,
  init: null,
  run: function (v) {
      var m = need(v); if (m) return m;
      return RT.loadImg(v.file).then(function (img) {
        var sw = img.naturalWidth, sh = img.naturalHeight, s = Math.min(1, (v.max || 200) / Math.max(sw, sh));
        return { outimg: H.drawResize(img, Math.round(sw * s), Math.round(sh * s)) };
      });
    } };
var FK='toolbox_fav_v2';
function sy(){try{return JSON.parse(localStorage.getItem(FK)||'[]')}catch(e){return[]}}
var fv=document.getElementById('fv');
function rf(){fv.classList.toggle('on',sy().indexOf("img-thumb")>=0)}
rf();fv.onclick=function(){var f=sy(),i=f.indexOf("img-thumb");
if(i>=0)f.splice(i,1);else f.push("img-thumb");
localStorage.setItem(FK,JSON.stringify(f));rf()};
var UK='toolbox_used_v2';
try{var u=JSON.parse(localStorage.getItem(UK)||'[]');u=u.filter(function(x){return x!=="img-thumb"});u.unshift("img-thumb");localStorage.setItem(UK,JSON.stringify(u.slice(0,12)))}catch(e){}
RT.boot(window.TOOL);
</script>
</body>
</html>
