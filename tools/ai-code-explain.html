<script>
/* ============================================================
   22-ai-code.js — AI 代码助手（规则引擎，离线真实可用）
   ============================================================ */
function detectLang(s) {
  if (/^\s*#!|import\s|def\s|print\(/.test(s)) return 'Python';
  if (/function\s|const\s|let\s|=>|console\./.test(s)) return 'JavaScript';
  if (/public\s+class|System\.out|void\s|import\s+java/.test(s)) return 'Java';
  if (/#include|int\s+main|std::/.test(s)) return 'C/C++';
  if (/func\s|package\s|fmt\./.test(s)) return 'Go';
  if (/<\?php/.test(s)) return 'PHP';
  if (/using\s+System|namespace\s/.test(s)) return 'C#';
  return '未知/通用';
}
function cc(c) {
  var n = 1;
  (c.match(/if|for|while|case|catch|\?|\|\||&&/g) || []).forEach(function () { n++; });
  return n;
}
var T = [];
function tool(o) { T.push(o); }

/* 1 代码解释 */
tool({ id: 'ai-code-explain', n: 'AI 代码解释', c: 'ai-code', d: '识别语言并统计结构，生成可读性说明。',
  f: [{ k: 'code', t: '代码', type: 'textarea' }, { k: 'out', t: '说明', type: 'out' }, { k: 'outhtml', t: '结构', type: 'outhtml' }],
  run: function (v) {
    var s = v.code || '', lang = detectLang(s);
    var lines = s.split('\n').filter(function (x) { return x.trim(); }).length;
    var fn = (s.match(/function\s+\w+|\bdef\s+\w+|\w+\s*\([^)]*\)\s*\{?$/gm) || []).length;
    return { out: '这是一段 ' + lang + ' 代码，共 ' + lines + ' 行有效代码、约 ' + fn + ' 个函数/方法定义。建议逐段阅读：先理解入口，再跟调用链。',
      outhtml: '<p>语言：<b>' + lang + '</b> · 有效行：' + lines + ' · 函数/方法：' + fn + '</p>' };
  } });

/* 2 注释生成 */
tool({ id: 'ai-code-comment', n: 'AI 自动注释', c: 'ai-code', d: '为函数/方法行生成占位注释。',
  f: [{ k: 'code', t: '代码', type: 'textarea' }, { k: 'out', t: '带注释代码', type: 'out' }],
  run: function (v) {
    var lines = (v.code || '').split('\n');
    var out = lines.map(function (l) {
      if (/function\s+(\w+)|def\s+(\w+)|(\w+)\s*\([^)]*\)\s*\{?\s*$/.test(l)) return '// 【待补】说明：' + l.trim() + '\n' + l;
      return l;
    });
    return { out: out.join('\n') };
  } });

/* 3 圈复杂度 */
tool({ id: 'ai-code-cc', n: 'AI 圈复杂度', c: 'ai-code', d: '估算函数圈复杂度（分支越多越复杂）。',
  f: [{ k: 'code', t: '代码', type: 'textarea' }, { k: 'out', t: '复杂度', type: 'out' }],
  run: function (v) {
    var n = cc(v.code || '');
    return { out: '估算圈复杂度：' + n + '（' + (n <= 5 ? '良好' : n <= 10 ? '适中' : '偏高，建议拆分') + '）' };
  } });

/* 4 TODO 提取 */
tool({ id: 'ai-code-todo', n: 'AI TODO 提取', c: 'ai-code', d: '提取 TODO/FIXME/XXX/HACK 注释。',
  f: [{ k: 'code', t: '代码', type: 'textarea' }, { k: 'out', t: '待办', type: 'out' }],
  run: function (v) {
    var r = (v.code || '').match(/(TODO|FIXME|XXX|HACK|OPTIMIZE|BUG)[^\n]*/g) || [];
    return { out: r.length ? r.join('\n') : '未发现待办标记' };
  } });

/* 5 代码气味 */
tool({ id: 'ai-code-smell', n: 'AI 代码气味', c: 'ai-code', d: '检测长函数/深嵌套/魔法数字。',
  f: [{ k: 'code', t: '代码', type: 'textarea' }, { k: 'out', t: '气味报告', type: 'out' }],
  run: function (v) {
    var s = v.code || '', r = [];
    var braces = 0, maxd = 0; s.split('').forEach(function (c) { if (c === '{') { braces++; maxd = Math.max(maxd, braces); } if (c === '}') braces--; });
    if (maxd > 3) r.push('嵌套过深（最深 ' + maxd + ' 层）');
    if ((s.match(/\b\d{3,}\b/g) || []).length > 3) r.push('存在多个魔法数字');
    if ((s.match(/function/g) || []).length > 5 && s.length > 400) r.push('函数偏多，考虑拆分模块');
    return { out: r.length ? r.join('\n') : '无明显气味' };
  } });

/* 6 自然语言→SQL */
tool({ id: 'ai-nl2sql', n: 'AI 自然语言转SQL', c: 'ai-code', d: '把简单中文描述转为 SELECT 语句。',
  f: [{ k: 'q', t: '描述(如:查询年龄大于18的用户)', type: 'text' }, { k: 'out', t: 'SQL', type: 'out' }],
  run: function (v) {
    var q = (v.q || '');
    if (/删除/.test(q)) return { out: '-- 危险操作：DELETE，请谨慎并加 WHERE\nDELETE FROM table WHERE condition;' };
    if (/更新|修改/.test(q)) return { out: 'UPDATE table SET col = value WHERE condition;' };
    if (/统计|总数|多少/.test(q)) return { out: 'SELECT COUNT(*) FROM users;' };
    if (/大于|超过/.test(q)) { var m = q.match(/(\d+)/); return { out: 'SELECT * FROM users WHERE age > ' + (m ? m[1] : '?') + ';' }; }
    if (/按|分组|每/.test(q)) return { out: 'SELECT col, COUNT(*) FROM users GROUP BY col;' };
    return { out: 'SELECT * FROM users WHERE condition;  -- 请补充具体条件（识别到：' + q + '）' };
  } });

/* 7 描述→正则 */
tool({ id: 'ai-desc2re', n: 'AI 描述转正则', c: 'ai-code', d: '把常见描述转为正则表达式。',
  f: [{ k: 'd', t: '描述(邮箱/手机/网址/中文/数字/日期)', type: 'text' }, { k: 'out', t: '正则', type: 'out' }],
  run: function (v) {
    var d = (v.d || '');
    var M = { '邮箱': /[\w.+-]+@[\w-]+\.[\w.-]+/, '手机': /1[3-9]\d{9}/, '网址': /https?:\/\/[^\s]+/, '中文': /[一-龥]+/, '数字': /\d+/, '日期': /\d{4}-\d{2}-\d{2}/, '身份证': /\d{17}[\dXx]/, '邮编': /\d{6}/, 'IP': /\d{1,3}(\.\d{1,3}){3}/, '姓名': /[\u4e00-\u9fa5]{2,4}/ };
    for (var k in M) if (d.indexOf(k) >= 0) return { out: M[k].toString() };
    return { out: '未识别描述，试试：邮箱 / 手机 / 网址 / 中文 / 数字 / 日期 / 身份证' };
  } });

/* 8 Mock 数据 */
tool({ id: 'ai-mock', n: 'AI Mock 数据', c: 'ai-code', d: '按字段名生成 JSON 假数据。',
  f: [{ k: 'fields', t: '字段(逗号分隔,如 name,age,email)', type: 'text', v: 'name,age,email' }, { k: 'n', t: '条数', type: 'number', v: 3 }, { k: 'out', t: 'JSON', type: 'out' }],
  run: function (v) {
    var fs = (v.fields || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean), arr = [];
    for (var i = 0; i < (v.n || 3); i++) {
      var o = {}; fs.forEach(function (f) {
        if (/name|姓名/.test(f)) o[f] = '用户' + (i + 1);
        else if (/age|年龄/.test(f)) o[f] = 18 + Math.floor(Math.random() * 40);
        else if (/email|邮箱/.test(f)) o[f] = 'user' + (i + 1) + '@example.com';
        else if (/id/.test(f)) o[f] = 1000 + i;
        else if (/price|金额|价格/.test(f)) o[f] = Math.round(Math.random() * 1000) / 10;
        else o[f] = 'val' + (i + 1);
      });
      arr.push(o);
    }
    return { out: JSON.stringify(arr, null, 2) };
  } });

/* 9 README 生成 */
tool({ id: 'ai-readme', n: 'AI README 生成', c: 'ai-code', d: '根据项目名与描述生成 README 骨架。',
  f: [{ k: 'name', t: '项目名', type: 'text' }, { k: 'desc', t: '一句话描述', type: 'text' }, { k: 'out', t: 'README', type: 'out' }],
  run: function (v) {
    var n = v.name || 'my-project', d = v.desc || '项目描述';
    return { out: '# ' + n + '\n\n' + d + '\n\n## 功能\n- \n\n## 安装\n```bash\nnpm install\n```\n\n## 使用\n```js\nimport ' + n + '\n```\n\n## 贡献\n欢迎提 Issue / PR。\n\n## License\nMIT' };
  } });

/* 10 单元测试模板 */
tool({ id: 'ai-unittest', n: 'AI 单元测试', c: 'ai-code', d: '根据函数名生成 xUnit 风格测试骨架。',
  f: [{ k: 'fns', t: '函数名(逗号分隔)', type: 'text', v: 'add,getUser' }, { k: 'lang', t: '语言', type: 'select', opts: ['js', 'py'], v: 'js' }, { k: 'out', t: '测试代码', type: 'out' }],
  run: function (v) {
    var fns = (v.fns || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean), out = '';
    if (v.lang === 'py') {
      out = "import unittest\nclass TestDemo(unittest.TestCase):\n";
      fns.forEach(function (f) { out += "    def test_" + f + "(self):\n        self.assertIsNotNone(" + f + "())\n"; });
    } else {
      out = "const assert = require('assert');\n";
      fns.forEach(function (f) { out += "describe('" + f + "', () => { it('works', () => { assert(" + f + "() !== undefined); }); });\n"; });
    }
    return { out: out };
  } });

/* 11 安全扫描 */
tool({ id: 'ai-secscan', n: 'AI 安全扫描', c: 'ai-code', d: '正则检测常见安全隐患。',
  f: [{ k: 'code', t: '代码', type: 'textarea' }, { k: 'out', t: '风险', type: 'out' }],
  run: function (v) {
    var s = v.code || '', r = [];
    if (/\beval\s*\(/.test(s)) r.push('⚠ 使用了 eval()，存在代码注入风险');
    if (/innerHTML\s*=/.test(s)) r.push('⚠ innerHTML 直接赋值可能导致 XSS');
    if (/password\s*=\s*['"][^'"]+['"]/.test(s)) r.push('⚠ 疑似硬编码密码');
    if (/(\+|")\s*[\w]+\s*\+\s*['"]?\s*(['"]|;)/.test(s) && /SELECT|INSERT/.test(s)) r.push('⚠ 可能存在 SQL 拼接注入');
    if (/Math\.random\(\)\.toString\(36\)/.test(s) && /token|secret/.test(s)) r.push('⚠ 用 Math.random 生成密钥不安全');
    return { out: r.length ? r.join('\n') : '未发现常见硬编码风险（仅供参考）' };
  } });

/* 12 依赖提取 */
tool({ id: 'ai-deps', n: 'AI 依赖提取', c: 'ai-code', d: '从 import/require 提取依赖列表。',
  f: [{ k: 'code', t: '代码', type: 'textarea' }, { k: 'out', t: '依赖', type: 'out' }],
  run: function (v) {
    var s = v.code || '', r = [];
    (s.match(/require\(['"]([^'"]+)['"]\)/g) || []).forEach(function (x) { r.push(x.match(/['"]([^'"]+)['"]/)[1]); });
    (s.match(/from\s+['"]([^'"]+)['"]/g) || []).forEach(function (x) { r.push(x.match(/['"]([^'"]+)['"]/)[1]); });
    return { out: r.length ? Array.from(new Set(r)).join('\n') : '未发现 import/require' };
  } });

/* 13 Git 提交信息 */
tool({ id: 'ai-commit', n: 'AI 提交信息', c: 'ai-code', d: '按改动类型生成 Conventional Commits。',
  f: [{ k: 'type', t: '类型', type: 'select', opts: ['feat', 'fix', 'docs', 'refactor', 'style', 'test', 'chore'], v: 'feat' }, { k: 'msg', t: '简述', type: 'text' }, { k: 'out', t: '提交信息', type: 'out' }],
  run: function (v) { return { out: v.type + ': ' + (v.msg || '描述本次改动') }; } });

/* 14 伪代码生成 */
tool({ id: 'ai-pseudo', n: 'AI 伪代码', c: 'ai-code', d: '把 if/for 等转为伪代码风格。',
  f: [{ k: 'code', t: '代码', type: 'textarea' }, { k: 'out', t: '伪代码', type: 'out' }],
  run: function (v) {
    var s = v.code || '';
    s = s.replace(/if\s*\((.*)\)\s*\{/, '如果 ($1) 则').replace(/for\s*\((.*)\)\s*\{/, '对于 ($1)').replace(/\}/g, '结束').replace(/console\.log/g, '输出');
    return { out: s };
  } });

/* 15 流程图文本(Mermaid) */
tool({ id: 'ai-flow', n: 'AI 流程图', c: 'ai-code', d: '生成 Mermaid 流程图文本。',
  f: [{ k: 'steps', t: '步骤(逗号分隔)', type: 'text', v: '开始,处理,结束' }, { k: 'out', t: 'Mermaid', type: 'out' }],
  run: function (v) {
    var st = (v.steps || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean);
    var o = 'graph TD\n'; st.forEach(function (s, i) { o += '  A' + i + '[' + s + ']\n'; if (i > 0) o += '  A' + (i - 1) + ' --> A' + i + '\n'; });
    return { out: o };
  } });

/* 16 技术栈识别 */
tool({ id: 'ai-stack', n: 'AI 技术栈识别', c: 'ai-code', d: '从代码特征识别可能技术栈。',
  f: [{ k: 'code', t: '代码/配置', type: 'textarea' }, { k: 'out', t: '技术栈', type: 'out' }],
  run: function (v) {
    var s = v.code || '', r = [];
    if (/react|useState|jsx/.test(s)) r.push('React');
    if (/vue|\.vue/.test(s)) r.push('Vue');
    if (/import\s|from\s+['"]/.test(s)) r.push('ES Module');
    if (/package\.json|node_modules/.test(s)) r.push('Node.js');
    if (/<template>|v-if|v-for/.test(s)) r.push('Vue SFC');
    if (/def\s|pip|print\(/.test(s)) r.push('Python');
    if (/dockerfile|FROM node/i.test(s)) r.push('Docker');
    if (/kubernetes|k8s|deployment/.test(s)) r.push('K8s');
    return { out: r.length ? r.join('、') : '未识别到明显技术栈' };
  } });

/* 17 Bug 关键词 */
tool({ id: 'ai-bugword', n: 'AI Bug 关键词', c: 'ai-code', d: '检测疑似临时/脆弱实现关键词。',
  f: [{ k: 'code', t: '代码', type: 'textarea' }, { k: 'out', t: '提示', type: 'out' }],
  run: function (v) {
    var s = v.code || '', words = ['暂时', '临时', '先这样', 'hack', ' workaround', 'FIXME', 'temp', 'test only', '硬凑'];
    var hit = words.filter(function (w) { return s.toLowerCase().indexOf(w.toLowerCase()) >= 0; });
    return { out: hit.length ? '疑似脆弱实现：' + hit.join('、') : '未发现临时/脆弱关键词' };
  } });

/* 18 变量命名建议 */
tool({ id: 'ai-naming', n: 'AI 变量命名', c: 'ai-code', d: '根据语义给出命名建议（规则）。',
  f: [{ k: 'cn', t: '中文含义', type: 'text' }, { k: 'out', t: '命名', type: 'out' }],
  run: function (v) {
    var c = (v.cn || '').trim();
    var M = { '用户': 'user', '数量': 'count', '总数': 'total', '列表': 'list', '配置': 'config', '索引': 'index', '结果': 'result', '状态': 'status', '名称': 'name', '时间': 'time', '消息': 'message', '数据': 'data', '请求': 'request', '响应': 'response', '错误': 'error', '价格': 'price', '地址': 'address', '日期': 'date' };
    for (var k in M) if (c.indexOf(k) >= 0) return { out: M[k] + (c.indexOf('列表') >= 0 || c.indexOf('数组') >= 0 ? 's' : '') };
    return { out: '未匹配到内置词表，建议：' + c.replace(/[一-龥]/g, '') + 'Var（请补充英文语义）' };
  } });

/* 19 API 文档 */
tool({ id: 'ai-apidoc', n: 'AI API 文档', c: 'ai-code', d: '根据接口名与参数生成文档骨架。',
  f: [{ k: 'path', t: '路径(如 /api/users)', type: 'text' }, { k: 'method', t: '方法', type: 'select', opts: ['GET', 'POST', 'PUT', 'DELETE'], v: 'GET' }, { k: 'params', t: '参数(逗号)', type: 'text' }, { k: 'out', t: '文档', type: 'out' }],
  run: function (v) {
    var ps = (v.params || '').split(',').filter(Boolean);
    var o = '### ' + v.method + ' ' + (v.path || '/api/x') + '\n\n**参数**\n';
    if (ps.length) ps.forEach(function (p) { o += '- `' + p.trim() + '` (string, 必填)\n'; }); else o += '- 无\n';
    o += '\n**返回**\n```json\n{ "code": 0, "data": {} }\n```';
    return { out: o };
  } });

/* 20 性能建议 */
tool({ id: 'ai-perf', n: 'AI 性能建议', c: 'ai-code', d: '基于模式给出性能优化提示。',
  f: [{ k: 'code', t: '代码', type: 'textarea' }, { k: 'out', t: '建议', type: 'out' }],
  run: function (v) {
    var s = v.code || '', r = [];
    if (/for\s*\([^)]*\)\s*\{[\s\S]*for\s*\(/.test(s)) r.push('存在嵌套循环，注意 O(n²) 复杂度');
    if (/\.push\(/.test(s) && /for/.test(s)) r.push('循环中频繁 push，可预分配数组长度');
    if (/JSON\.parse\(JSON\.stringify/.test(s)) r.push('深拷贝用 JSON 序列化有性能与类型损失，大数据考虑结构化克隆');
    if (/querySelectorAll/.test(s) && /for/.test(s)) r.push('重复 DOM 查询，可缓存结果');
    if (/\+\+|--/.test(s) && /await/.test(s)) r.push('循环内 await 会串行，考虑并发 Promise.all');
    return { out: r.length ? r.join('\n') : '未发现明显性能反模式' };
  } });

/* 21 CHANGELOG 生成 */
tool({ id: 'ai-changelog', n: 'AI CHANGELOG', c: 'ai-code', d: '根据提交信息生成 CHANGELOG 段。',
  f: [{ k: 'msgs', t: '提交信息(逗号/换行)', type: 'textarea' }, { k: 'ver', t: '版本', type: 'text', v: '1.0.0' }, { k: 'out', t: 'CHANGELOG', type: 'out' }],
  run: function (v) {
    var ms = (v.msgs || '').split(/[,\n]/).map(function (x) { return x.trim(); }).filter(Boolean);
    var o = '## [' + (v.ver || '1.0.0') + '] - ' + new Date().toISOString().slice(0, 10) + '\n';
    ms.forEach(function (m) { o += '- ' + m + '\n'; });
    return { out: o };
  } });

/* 22 代码片段生成 */
tool({ id: 'ai-snippet', n: 'AI 代码片段', c: 'ai-code', d: '生成常用代码片段（防抖/节流/深拷贝等）。',
  f: [{ k: 'name', t: '片段名', type: 'select', opts: ['debounce', 'throttle', 'deepclone', 'clamp', 'random', 'uuid'], v: 'debounce' }, { k: 'out', t: '代码', type: 'out' }],
  run: function (v) {
    var S = {
      debounce: 'function debounce(fn, d){let t;return function(){clearTimeout(t);t=setTimeout(()=>fn.apply(this,arguments),d);};}',
      throttle: 'function throttle(fn, d){let ok=true;return function(){if(!ok)return;ok=false;fn.apply(this,arguments);setTimeout(()=>ok=true,d);};}',
      deepclone: 'const deepClone = o => structuredClone ? structuredClone(o) : JSON.parse(JSON.stringify(o));',
      clamp: 'const clamp = (x, a, b) => Math.min(b, Math.max(a, x));',
      random: 'const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;',
      uuid: 'const uuid = () => crypto.randomUUID ? crypto.randomUUID() : (""+1e7+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^c*Math.random()*16>>c/4).toString(16));'
    };
    return { out: S[v.name] || '未知片段' };
  } });

/* 23 代码行数统计 */
tool({ id: 'ai-loc', n: 'AI 行数统计', c: 'ai-code', d: '统计总行/有效行/注释行。',
  f: [{ k: 'code', t: '代码', type: 'textarea' }, { k: 'out', t: '统计', type: 'out' }],
  run: function (v) {
    var ls = (v.code || '').split('\n'), total = ls.length, blank = 0, cmt = 0;
    ls.forEach(function (l) { var t = l.trim(); if (!t) blank++; else if (/^\/\/|^\*|^\/\*|^#/.test(t)) cmt++; });
    return { out: '总行 ' + total + ' · 空白 ' + blank + ' · 注释 ' + cmt + ' · 有效 ' + (total - blank - cmt) };
  } });

/* 24 代码格式化检测 */
tool({ id: 'ai-fmtcheck', n: 'AI 格式化检测', c: 'ai-code', d: '检测缩进混用/行尾空格等格式问题。',
  f: [{ k: 'code', t: '代码', type: 'textarea' }, { k: 'out', t: '问题', type: 'out' }],
  run: function (v) {
    var s = v.code || '', r = [];
    if (/ \n|　\n/.test(s)) r.push('存在行尾空格/全角空格');
    if (/^\t+/m.test(s) && /^ +/m.test(s)) r.push('缩进混用（Tab 与空格）');
    if (/; {2,}/.test(s)) r.push('多余空格');
    return { out: r.length ? r.join('\n') : '格式基本整洁' };
  } });
