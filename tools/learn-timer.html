<!DOCTYPE html>

<meta charset="UTF-8">

<meta name="description" content="按科目计时，统计今日专注。在线免费使用，文件不上传服务器。">

</head>
<body>
<div class="tool-top"><div class="tool-top-in">
<a class="back" href="../index.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>返回</a>
<span class="tool-cat">学习教育</span>
<button class="tool-fav" id="fv" title="收藏">★</button>
</div></div>
<main class="pane">
<h1 class="tool-title" style="margin-bottom:6px">学习计时</h1>
<p class="lede">按科目计时，统计今日专注</p>
<div id="app"></div>
<div class="rel"><h4>同类工具</h4><div class="grid"><a class="card" href="learn-mindmap.html"><div class="card-t"><span class="card-name">思维导图</span></div><div class="card-desc">缩进大纲一键生成可折叠树状图</div></a><a class="card" href="learn-flow.html"><div class="card-t"><span class="card-name">流程图</span></div><div class="card-desc">用 节点→下一节点 生成简单流程图</div></a><a class="card" href="learn-flashcard.html"><div class="card-t"><span class="card-name">闪卡复习</span></div><div class="card-desc">自定义卡片，正反面翻牌记忆</div></a><a class="card" href="learn-ebb.html"><div class="card-t"><span class="card-name">艾宾浩斯复习</span></div><div class="card-desc">输入学习日，算出最佳复习时间点</div></a><a class="card" href="learn-words.html"><div class="card-t"><span class="card-name">背单词</span></div><div class="card-desc">随机抽词，点一下看释义</div></a><a class="card" href="learn-wrong.html"><div class="card-t"><span class="card-name">错题本</span></div><div class="card-desc">记录错题，可标注掌握</div></a></div></div>
</main>
<div class="foot"><div class="foot-in">
<b>超有用的工具箱</b> · 学习计时<br>
所有处理都在你的浏览器本地完成，文件不会上传到任何服务器 · <a href="../index.html">全部工具</a>
</div></div>
<div id="toast"></div>

<script src="../assets/runtime.js"></script>
<script>
/* 学习 / 记忆 — 12 个 */
var Lr = {};
Lr.words = [['apple', '苹果'], ['banana', '香蕉'], ['computer', '电脑'], ['happy', '开心'], ['science', '科学'], ['knowledge', '知识'], ['student', '学生'], ['teacher', '老师'], ['language', '语言'], ['memory', '记忆'], ['practice', '练习'], ['progress', '进步'], ['future', '未来'], ['dream', '梦想'], ['friend', '朋友'], ['family', '家庭'], ['health', '健康'], ['success', '成功'], ['courage', '勇气'], ['wisdom', '智慧'], ['nature', '自然'], ['travel', '旅行'], ['music', '音乐'], ['book', '书'], ['time', '时间'], ['world', '世界'], ['idea', '想法'], ['skill', '技能'], ['goal', '目标'], ['habit', '习惯']];


window.TOOL = { id: "learn-timer", n: "学习计时", c: "learn", d: "按科目计时，统计今日专注",
  custom: null,
  fields: [{"k":"cv","t":"计时","type":"custom","html":"<div style=\"display:flex;gap:6px;margin-bottom:8px\"><input id=\"ltSubj\" class=\"ipt\" placeholder=\"科目\" style=\"flex:1\"><button id=\"ltStart\" class=\"btn btn-pri\">开始</button><button id=\"ltStop\" class=\"btn btn-sec\">结束</button></div><div id=\"ltView\" style=\"font-size:13px\"></div>"}],
  auto: true,
  first: true,
  init: function (RT) {
    var KEY = 'learn_timer_v2'; var subj = document.getElementById('ltSubj'), start = document.getElementById('ltStart'), stop = document.getElementById('ltStop'), view = document.getElementById('ltView');
    var begin = 0, running = null;
    function load() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
    function save(o) { localStorage.setItem(KEY, JSON.stringify(o)); }
    function render() { var o = load(); var today = new Date().toDateString(); var keys = Object.keys(o).filter(function (k) { return o[k].date === today; }); var html = keys.length ? keys.map(function (k) { return '<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--ink-1)"><span>' + RT.esc(k) + '</span><b>' + Math.round(o[k].sec / 60) + ' 分</b></div>'; }).join('') : '<div style="color:var(--ink-3)">今日暂无记录</div>'; view.innerHTML = html; }
    start.onclick = function () { if (!subj.value) { RT.toast('先填科目'); return; } begin = Date.now(); running = subj.value; RT.toast('开始计时：' + running); };
    stop.onclick = function () { if (!running) return; var o = load(); var today = new Date().toDateString(); if (!o[running]) o[running] = { date: today, sec: 0 }; o[running].date = today; o[running].sec += Math.floor((Date.now() - begin) / 1000); save(o); RT.toast('已记录 ' + running); running = null; render(); };
    render();
  },
  run: function () {} };
var FK='toolbox_fav_v2';
function sy(){try{return JSON.parse(localStorage.getItem(FK)||'[]')}catch(e){return[]}}
var fv=document.getElementById('fv');
function rf(){fv.classList.toggle('on',sy().indexOf("learn-timer")>=0)}
rf();fv.onclick=function(){var f=sy(),i=f.indexOf("learn-timer");
if(i>=0)f.splice(i,1);else f.push("learn-timer");
localStorage.setItem(FK,JSON.stringify(f));rf()};
var UK='toolbox_used_v2';
try{var u=JSON.parse(localStorage.getItem(UK)||'[]');u=u.filter(function(x){return x!=="learn-timer"});u.unshift("learn-timer");localStorage.setItem(UK,JSON.stringify(u.slice(0,12)))}catch(e){}
RT.boot(window.TOOL);
</script>
</body>
</html>
