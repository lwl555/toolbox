<p class="lede">把 Base64 还原为可下载文件。</p>
<div id="app"></div>
<div class="rel"><h4>同类工具</h4><div class="grid"><a class="card" href="fl-md5.html"><div class="card-t"><span class="card-name">文件 MD5</span></div><div class="card-desc">计算文件的 MD5 校验值。</div></a><a class="card" href="fl-sha.html"><div class="card-t"><span class="card-name">文件 SHA256</span></div><div class="card-desc">计算文件的 SHA-256 校验值（需安全环境）。</div></a><a class="card" href="fl-b64.html"><div class="card-t"><span class="card-name">文件转 Base64</span></div><div class="card-desc">任意文件编码为 Base64 文本。</div></a><a class="card" href="fl-diff.html"><div class="card-t"><span class="card-name">文本差异对比</span></div><div class="card-desc">逐行对比，标记新增/删除。</div></a><a class="card" href="fl-split.html"><div class="card-t"><span class="card-name">文件分块</span></div><div class="card-desc">按大小切分为多个片段（便于传输）。</div></a><a class="card" href="fl-hex.html"><div class="card-t"><span class="card-name">十六进制预览</span></div><div class="card-desc">查看文件头部字节（前 256 字节）。</div></a></div></div>

<div class="foot"><div class="foot-in">

<div id="toast"></div>

<script src="../assets/runtime.js"></script>
<script>
/* ============================================================
   19-file.js — 文件工具（哈希 / 差分 / 拆分 / 编码，本地计算）
   ============================================================ */

  
window.TOOL = { id: "fl-b64d", n: "Base64 转文件", c: "file", d: "把 Base64 还原为可下载文件。",
  custom: null,
  fields: [{"k":"data","t":"Base64 文本","type":"textarea","rows":5,"ph":"粘贴 Base64"},{"k":"name","t":"文件名","type":"text","v":"output.bin"},{"k":"outfile","t":"输出","type":"outfile"}],
  auto: true,
  first: true,
  init: null,
  run: function (v) {
      var s = (v.data || '').trim(); if (!s) return { note: '请粘贴 Base64', outfile: [] };
      try {
        var bin = atob(s), bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return { outfile: [{ name: v.name || 'output.bin', blob: new Blob([bytes]), size: bytes.length }] };
      } catch (e) { return { note: 'Base64 解析失败', outfile: [], warn: true }; }
    } };
var FK='toolbox_fav_v2';
function sy(){try{return JSON.parse(localStorage.getItem(FK)||'[]')}catch(e){return[]}}
var fv=document.getElementById('fv');
function rf(){fv.classList.toggle('on',sy().indexOf("fl-b64d")>=0)}
rf();fv.onclick=function(){var f=sy(),i=f.indexOf("fl-b64d");
if(i>=0)f.splice(i,1);else f.push("fl-b64d");
localStorage.setItem(FK,JSON.stringify(f));rf()};
var UK='toolbox_used_v2';
try{var u=JSON.parse(localStorage.getItem(UK)||'[]');u=u.filter(function(x){return x!=="fl-b64d"});u.unshift("fl-b64d");localStorage.setItem(UK,JSON.stringify(u.slice(0,12)))}catch(e){}
RT.boot(window.TOOL);
</script>
</body>
