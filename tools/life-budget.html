<script>
/* 生活 / 效率 — 24 个 */
var Lf = {};
Lf.quote = ['行动是治愈恐惧的良药。', '今天的事今天做。', '你只管努力，剩下交给时间。', '种一棵树最好的时间是十年前，其次是现在。', '自律给你自由。', '把简单的事做好就是不简单。', '保持热爱，奔赴山海。', '慢慢来，比较快。', '不为失败找理由，只为成功找方法。', '越努力越幸运。', '细节决定成败。', '坚持就是胜利。'];
Lf.tip = ['每天喝够 8 杯水。', '久坐一小时起来活动 2 分钟。', '睡前半小时远离屏幕。', '饭后散步 15 分钟助消化。', '用眼 20 分钟看远处 20 秒。', '早睡早起精神好。', '每周运动 3 次以上。', '多吃蔬菜水果少吃油。', '保持微笑，心情更好。', '工作 25 分钟休息 5 分钟。'];
Lf.pomodoroState = null;
Lf.stopwatch = null;


window.TOOL = { id: "life-budget", n: "记账本", c: "life", d: "本地记收支，看结余",
  custom: null,
  fields: [{"k":"cv","t":"记账","type":"custom","html":"<div style=\"display:flex;gap:6px;margin-bottom:8px\"><select id=\"bgType\" class=\"sel\"><option value=\"-\">支出</option><option value=\"+\">收入</option></select><input id=\"bgAmt\" class=\"ipt\" type=\"number\" placeholder=\"金额\" style=\"flex:1\"><input id=\"bgNote\" class=\"ipt\" placeholder=\"备注\" style=\"flex:1\"><button id=\"bgAdd\" class=\"btn btn-pri\">记</button></div><div id=\"bgList\" style=\"font-size:13px\"></div>"}],
  auto: true,
  first: true,
  init: function (RT) {
    var KEY = 'life_budget_v2'; var type = document.getElementById('bgType'), amt = document.getElementById('bgAmt'), note = document.getElementById('bgNote'), add = document.getElementById('bgAdd'), list = document.getElementById('bgList');
    function load() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } }
    function save(a) { localStorage.setItem(KEY, JSON.stringify(a)); }
    function render() { var a = load(); var sum = a.reduce(function (s, r) { return s + (r.t === '+' ? r.a : -r.a); }, 0); list.innerHTML = '<div style="margin-bottom:6px;font-weight:600">结余：' + sum.toFixed(2) + ' 元</div>' + a.slice(-10).reverse().map(function (r) { return '<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--ink-1)"><span>' + RT.esc(r.note || '') + '</span><b style="color:' + (r.t === '+' ? '#1a6b55' : '#9b1c1c') + '">' + r.t + r.a + '</b></div>'; }).join(''); }
    add.onclick = function () { if (!amt.value) return; var a = load(); a.push({ t: type.value, a: parseFloat(amt.value), note: note.value }); save(a); amt.value = ''; note.value = ''; render(); };
    render();
  },
  run: function () {} };
var FK='toolbox_fav_v2';
function sy(){try{return JSON.parse(localStorage.getItem(FK)||'[]')}catch(e){return[]}}
var fv=document.getElementById('fv');
function rf(){fv.classList.toggle('on',sy().indexOf("life-budget")>=0)}
rf();fv.onclick=function(){var f=sy(),i=f.indexOf("life-budget");
if(i>=0)f.splice(i,1);else f.push("life-budget");
localStorage.setItem(FK,JSON.stringify(f));rf()};
var UK='toolbox_used_v2';
try{var u=JSON.parse(localStorage.getItem(UK)||'[]');u=u.filter(function(x){return x!=="life-budget"});u.unshift("life-budget");localStorage.setItem(UK,JSON.stringify(u.slice(0,12)))}catch(e){}
RT.boot(window.TOOL);
</script>
