<body>
<div class="tool-top"><div class="tool-top-in">
<a class="back" href="../index.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>返回</a>
<span class="tool-cat">PDF工具</span>
<button class="tool-fav" id="fv" title="收藏">★</button>
</div></div>
<main class="pane">
<h1 class="tool-title" style="margin-bottom:6px">PDF 重新保存</h1>
<p class="lede">重新打包，去除部分冗余对象。</p>
<div id="app"></div>
<div class="rel"><h4>同类工具</h4><div class="grid"><a class="card" href="pdf-merge.html"><div class="card-t"><span class="card-name">PDF 合并</span></div><div class="card-desc">多份 PDF 按顺序合并成一份。</div></a><a class="card" href="pdf-split.html"><div class="card-t"><span class="card-name">PDF 拆分单页</span></div><div class="card-desc">每一页导出为独立 PDF 文件。</div></a><a class="card" href="pdf-extract.html"><div class="card-t"><span class="card-name">PDF 提取页</span></div><div class="card-desc">按页码范围导出（如 1,3,5-8）。</div></a><a class="card" href="pdf-remove.html"><div class="card-t"><span class="card-name">PDF 删除页</span></div><div class="card-desc">删除指定页码后导出。</div></a><a class="card" href="pdf-rotate.html"><div class="card-t"><span class="card-name">PDF 旋转页</span></div><div class="card-desc">将所有页面旋转 90/180/270 度。</div></a><a class="card" href="pdf-info.html"><div class="card-t"><span class="card-name">PDF 信息</span></div><div class="card-desc">读取页数。</div></a></div></div>
</main>
<div class="foot"><div class="foot-in">
<b>超有用的工具箱</b> · PDF 重新保存<br>
所有处理都在你的浏览器本地完成，文件不会上传到任何服务器 · <a href="../index.html">全部工具</a>
</div></div>
<div id="toast"></div>

<script src="../assets/runtime.js"></script>
<script>
/* ============================================================
   16-pdf.js — PDF 处理（pdf-lib，浏览器本地，零上传）
   ============================================================ */

  
window.TOOL = { id: "pdf-repack", n: "PDF 重新保存", c: "pdf", d: "重新打包，去除部分冗余对象。",
  custom: null,
  fields: [{"k":"file","t":"PDF 文件","type":"file","accept":".pdf"},{"k":"outfile","t":"输出","type":"outfile"}],
  auto: true,
  first: true,
  init: null,
  run: function (v) {
      if (!v.file) return { note: '请选择 PDF', outfile: [] };
      return RT.lib(RT.CDN.pdfLib).then(function () {
        return bufOf(v.file).then(function (b) { return window.PDFLib.PDFDocument.load(b); }).then(function (src) {
          return src.save().then(function (bytes) {
            return { outfile: [{ name: 'repacked.pdf', blob: new Blob([bytes], { type: 'application/pdf' }), size: bytes.length }], note: '原 ' + RT.fmtSize(v.file.size) + ' → ' + RT.fmtSize(bytes.length) };
          });
        });
      });
    } };
var FK='toolbox_fav_v2';
function sy(){try{return JSON.parse(localStorage.getItem(FK)||'[]')}catch(e){return[]}}
var fv=document.getElementById('fv');
function rf(){fv.classList.toggle('on',sy().indexOf("pdf-repack")>=0)}
rf();fv.onclick=function(){var f=sy(),i=f.indexOf("pdf-repack");
if(i>=0)f.splice(i,1);else f.push("pdf-repack");
localStorage.setItem(FK,JSON.stringify(f));rf()};
var UK='toolbox_used_v2';
try{var u=JSON.parse(localStorage.getItem(UK)||'[]');u=u.filter(function(x){return x!=="pdf-repack"});u.unshift("pdf-repack");localStorage.setItem(UK,JSON.stringify(u.slice(0,12)))}catch(e){}
RT.boot(window.TOOL);
</script>
</body>
</html>
