<div class="rel"><h4>同类工具</h4><div class="grid"><a class="card" href="cvt-length.html"><div class="card-t"><span class="card-name">长度换算</span></div><div class="card-desc">米/千米/厘米/英寸/英尺/英里/海里等互转</div></a><a class="card" href="cvt-area.html"><div class="card-t"><span class="card-name">面积换算</span></div><div class="card-desc">平方米/亩/公顷/英亩/平方英尺互转</div></a><a class="card" href="cvt-volume.html"><div class="card-t"><span class="card-name">体积容量换算</span></div><div class="card-desc">升/毫升/加仑/杯/品脱互转</div></a><a class="card" href="cvt-mass.html"><div class="card-t"><span class="card-name">重量质量换算</span></div><div class="card-desc">千克/克/斤/两/磅/盎司/克拉互转</div></a><a class="card" href="cvt-temp.html"><div class="card-t"><span class="card-name">温度换算</span></div><div class="card-desc">摄氏度/华氏度/开尔文互转</div></a><a class="card" href="cvt-speed.html"><div class="card-t"><span class="card-name">速度换算</span></div><div class="card-desc">米每秒/千米时/英里时/节互转</div></a></div></div>

<script>
/* 单位换算 — 28 个 */
var Ch = {};
Ch.lin = function (v, from, to, units) { var f = units[from], t = units[to]; if (!f || !t) return null; return v * f / t; };
Ch.opt = function (obj) { return Object.keys(obj).map(function (k) { return { v: k, t: obj[k].t }; }); };


window.TOOL = { id: "cvt-data-time", n: "下载时间估算", c: "convert", d: "按文件大小和网速估算下载耗时",
  custom: null,
  fields: [{"k":"size","t":"文件大小","type":"number","v":1},{"k":"unit","t":"大小单位","type":"select","opts":[{"v":"MB","t":"MB"},{"v":"GB","t":"GB"}]},{"k":"speed","t":"网速 (Mbps)","type":"number","v":100},{"k":"out","t":"结果","type":"out","dl":1,"mono":1}],
  auto: true,
  first: true,
  init: null,
  run: function (v) { var bytes = v.size * (v.unit === 'GB' ? 1073741824 : 1048576); var bits = bytes * 8; var sec = bits / (v.speed * 1e6); var m = Math.floor(sec / 60), s = Math.round(sec % 60); return { out: m + ' 分 ' + s + ' 秒', metrics: [{ t: '约', v: sec.toFixed(1) + ' 秒' }] }; } };
var FK='toolbox_fav_v2';
function sy(){try{return JSON.parse(localStorage.getItem(FK)||'[]')}catch(e){return[]}}
var fv=document.getElementById('fv');
function rf(){fv.classList.toggle('on',sy().indexOf("cvt-data-time")>=0)}
rf();fv.onclick=function(){var f=sy(),i=f.indexOf("cvt-data-time");
if(i>=0)f.splice(i,1);else f.push("cvt-data-time");
localStorage.setItem(FK,JSON.stringify(f));rf()};
var UK='toolbox_used_v2';
try{var u=JSON.parse(localStorage.getItem(UK)||'[]');u=u.filter(function(x){return x!=="cvt-data-time"});u.unshift("cvt-data-time");localStorage.setItem(UK,JSON.stringify(u.slice(0,12)))}catch(e){}
RT.boot(window.TOOL);
</script>
