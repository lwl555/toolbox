<div class="rel"><h4>同类工具</h4><div class="grid"><a class="card" href="life-stopwatch.html"><div class="card-t"><span class="card-name">秒表</span></div><div class="card-desc">精确计时，支持分圈记录</div></a><a class="card" href="life-countdown-timer.html"><div class="card-t"><span class="card-name">倒计时器</span></div><div class="card-desc">设定分钟数，到点响铃提醒</div></a><a class="card" href="life-worldclock.html"><div class="card-t"><span class="card-name">世界时钟</span></div><div class="card-desc">同时显示多个城市当前时间</div></a><a class="card" href="life-todo.html"><div class="card-t"><span class="card-name">待办清单</span></div><div class="card-desc">本地保存的 Todo（刷新不丢）</div></a><a class="card" href="life-habit.html"><div class="card-t"><span class="card-name">习惯打卡</span></div><div class="card-desc">每天点一下，记录连续天数</div></a><a class="card" href="life-weight.html"><div class="card-t"><span class="card-name">体重记录</span></div><div class="card-desc">记录每日体重，看变化趋势</div></a></div></div>

<script>
/* 生活 / 效率 — 24 个 */
var Lf = {};
Lf.quote = ['行动是治愈恐惧的良药。', '今天的事今天做。', '你只管努力，剩下交给时间。', '种一棵树最好的时间是十年前，其次是现在。', '自律给你自由。', '把简单的事做好就是不简单。', '保持热爱，奔赴山海。', '慢慢来，比较快。', '不为失败找理由，只为成功找方法。', '越努力越幸运。', '细节决定成败。', '坚持就是胜利。'];
Lf.tip = ['每天喝够 8 杯水。', '久坐一小时起来活动 2 分钟。', '睡前半小时远离屏幕。', '饭后散步 15 分钟助消化。', '用眼 20 分钟看远处 20 秒。', '早睡早起精神好。', '每周运动 3 次以上。', '多吃蔬菜水果少吃油。', '保持微笑，心情更好。', '工作 25 分钟休息 5 分钟。'];
Lf.pomodoroState = null;
Lf.stopwatch = null;


window.TOOL = { id: "life-pomodoro", n: "番茄钟", c: "life", d: "25 分钟专注 + 5 分钟休息（可自定义）",
  custom: null,
  fields: [{"k":"work","t":"专注分钟","type":"number","v":25,"min":1,"max":120},{"k":"break","t":"休息分钟","type":"number","v":5,"min":1,"max":60},{"k":"cv","t":"计时器","type":"custom","html":"<div id=\"pomo\" style=\"text-align:center;padding:24px\"><div id=\"pomoTime\" style=\"font-size:52px;font-weight:700;font-variant-numeric:tabular-nums\">25:00</div><div id=\"pomoMode\" style=\"color:var(--ink-3);margin:6px 0 14px\">专注</div><button id=\"pomoToggle\" class=\"btn btn-pri\">开始</button> <button id=\"pomoReset\" class=\"btn btn-sec\">重置</button></div><div id=\"pomoLog\" style=\"font-size:12px;color:var(--ink-3);margin-top:10px\"></div>"}],
  auto: true,
  first: true,
  init: function (RT) {
    var time = document.getElementById('pomoTime'), mode = document.getElementById('pomoMode'), tog = document.getElementById('pomoToggle'), reset = document.getElementById('pomoReset'), log = document.getElementById('pomoLog');
    var s = Lf.pomodoroState || { left: 25 * 60, running: false, phase: 'work', done: 0 }; Lf.pomodoroState = s;
    function show() { var m = Math.floor(s.left / 60), ss = s.left % 60; time.textContent = (m < 10 ? '0' : '') + m + ':' + (ss < 10 ? '0' : '') + ss; mode.textContent = s.phase === 'work' ? '专注' : '休息'; }
    function tick() { if (!s.running) return; s.left--; if (s.left <= 0) { s.phase = s.phase === 'work' ? 'break' : 'work'; if (s.phase === 'work') { s.done++; log.textContent = '已完成 ' + s.done + ' 个番茄'; } s.left = (s.phase === 'work' ? (document.getElementById('f_work') ? +document.getElementById('f_work').value : 25) : (document.getElementById('f_break') ? +document.getElementById('f_break').value : 5)) * 60; }
      show(); }
    tog.onclick = function () { s.running = !s.running; tog.textContent = s.running ? '暂停' : '开始'; if (s.running && !Lf.pomoTimer) Lf.pomoTimer = setInterval(tick, 1000); if (!s.running && Lf.pomoTimer) { clearInterval(Lf.pomoTimer); Lf.pomoTimer = null; } };
    reset.onclick = function () { s.left = (document.getElementById('f_work') ? +document.getElementById('f_work').value : 25) * 60; s.running = false; s.phase = 'work'; tog.textContent = '开始'; if (Lf.pomoTimer) { clearInterval(Lf.pomoTimer); Lf.pomoTimer = null; } show(); };
    s.left = (document.getElementById('f_work') ? +document.getElementById('f_work').value : 25) * 60; show();
  },
  run: function () {} };
var FK='toolbox_fav_v2';
function sy(){try{return JSON.parse(localStorage.getItem(FK)||'[]')}catch(e){return[]}}
var fv=document.getElementById('fv');
function rf(){fv.classList.toggle('on',sy().indexOf("life-pomodoro")>=0)}
rf();fv.onclick=function(){var f=sy(),i=f.indexOf("life-pomodoro");
if(i>=0)f.splice(i,1);else f.push("life-pomodoro");
localStorage.setItem(FK,JSON.stringify(f));rf()};
var UK='toolbox_used_v2';
try{var u=JSON.parse(localStorage.getItem(UK)||'[]');u=u.filter(function(x){return x!=="life-pomodoro"});u.unshift("life-pomodoro");localStorage.setItem(UK,JSON.stringify(u.slice(0,12)))}catch(e){}
RT.boot(window.TOOL);
</script>
</body>
