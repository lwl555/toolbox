tool({ id: 'ai-click', n: 'AI 震惊体', c: 'ai-write', d: '生成标题党风格（娱乐用，谨慎发布）。',
  f: [{ k: 'topic', t: '主题', type: 'text' }, { k: 'out', t: '标题', type: 'out' }],
  run: function (v) {
    var t = v.topic || '这件事';
    return { out: ['震惊！' + t + '竟然……', '千万别再' + t + '了！', t + '的真相，第3点太重要', '我试了' + t + '，结果……', '所有人都该知道的' + t].join('\n') };
  } });

/* 38 AI 公文模板 */
tool({ id: 'ai-gongwen', n: 'AI 公文模板', c: 'ai-write', d: '生成通知类公文骨架。',
  f: [{ k: 'topic', t: '事项', type: 'text' }, { k: 'point', t: '内容要点', type: 'textarea' }, { k: 'out', t: '公文', type: 'out' }],
  run: function (v) {
    var raw = (v.point || '').split(/[。\n]/).filter(Boolean);
    var pts = raw.map(function (p, i) { return '（' + (i + 1) + '）' + p.trim() + '。'; });
    return { out: '关于' + (v.topic || '有关事项') + '的通知\n\n各相关单位：\n现将' + (v.topic || '有关事项') + '通知如下：\n' + pts.join('\n') + '\n\n特此通知。\n\n' + (new Date().getFullYear()) + '年' + (new Date().getMonth() + 1) + '月' + new Date().getDate() + '日' };
  } });

tool({ id: 'ai-iou', n: 'AI 借条模板', c: 'ai-write', d: '生成规范借条文本。',
  f: [{ k: 'a', t: '出借人', type: 'text' }, { k: 'b', t: '借款人', type: 'text' }, { k: 'amt', t: '金额(元)', type: 'number', v: 1000 }, { k: 'out', t: '借条', type: 'out' }],
  run: function (v) {
    return { out: '借条\n今借到' + (v.a || '（出借人）') + '人民币' + (v.amt || 0) + '元整。借款人：' + (v.b || '（借款人）') + '。于约定日期归还。\n借款人签字：______  日期：____年__月__日' };
  } });


window.TOOL = (function () { var t = (typeof T !== 'undefined') ? T.filter(function (x) { return x.id === "ai-write-gx"; })[0] : null; if (t && !t.fields) t.fields = t.f; return t; })();

var fv=document.getElementById('fv');

rf();fv.onclick=function(){var f=sy(),i=f.indexOf("ai-write-gx");
if(i>=0)f.splice(i,1);else f.push("ai-write-gx");

var UK='toolbox_used_v2';

RT.boot(window.TOOL);
