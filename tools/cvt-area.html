var Ch = {};

Ch.opt = function (obj) { return Object.keys(obj).map(function (k) { return { v: k, t: obj[k].t }; }); };

  auto: true,
  first: true,

  run: function (v) { var F = {}; Object.keys(AREA).forEach(function (k) { F[k] = AREA[k].f; }); var r = Ch.lin(v.v, v.from, v.to, F); return { out: (Math.round(r * 1e6) / 1e6) + '' }; } };
var FK='toolbox_fav_v2';

if(i>=0)f.splice(i,1);else f.push("cvt-area");
localStorage.setItem(FK,JSON.stringify(f));rf()};
var UK='toolbox_used_v2';
try{var u=JSON.parse(localStorage.getItem(UK)||'[]');u=u.filter(function(x){return x!=="cvt-area"});u.unshift("cvt-area");localStorage.setItem(UK,JSON.stringify(u.slice(0,12)))}catch(e){}
