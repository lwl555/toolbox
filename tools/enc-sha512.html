var Hh = {};
Hh.b64e = function (s) { try { return btoa(unescape(encodeURIComponent(s))); } catch (e) { return ''; } };
Hh.b64d = function (s) { try { return decodeURIComponent(escape(atob(s))); } catch (e) { throw new Error('Base64 格式不正确'); } };
Hh.hexE = function (s) { var o = ''; for (var i = 0; i < s.length; i++) o += s.charCodeAt(i).toString(16).padStart(2, '0') + (i % 1 ? '' : ''); return o; };
Hh.toHex = function (s) { var o = ''; for (var i = 0; i < s.length; i++) o += s.charCodeAt(i).toString(16).padStart(2, '0'); return o; };
Hh.fromHex = function (s) { s = s.replace(/\s/g, ''); if (s.length % 2) throw new Error('十六进制长度应为偶数'); var o = ''; for (var i = 0; i < s.length; i += 2) { var c = parseInt(s.substr(i, 2), 16); if (isNaN(c)) throw new Error('含非法十六进制字符'); o += String.fromCharCode(c); } return o; };
Hh.bits = function (s) { var o = ''; for (var i = 0; i < s.length; i++) o += s.charCodeAt(i).toString(2).padStart(8, '0') + ' '; return o.trim(); };
Hh.fromBits = function (s) { var parts = s.trim().split(/\s+/), o = ''; for (var i = 0; i < parts.length; i++) { var n = parseInt(parts[i], 2); if (isNaN(n)) throw new Error('第 ' + (i + 1) + ' 段不是二进制'); o += String.fromCharCode(n); } return o; };
Hh.convBase = function (s, from, to) {
  s = (s + '').trim().toUpperCase();
  var dec = 0;
  if (from === 10) { dec = parseInt(s, 10); if (isNaN(dec)) throw new Error('不是合法的十进制数'); return dec.toString(to); }
  var map = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  for (var i = 0; i < s.length; i++) {
    var d = map.indexOf(s[i]); if (d < 0 || d >= from) throw new Error('字符 ' + s[i] + ' 不在 ' + from + ' 进制内');
    dec = dec * from + d;
  }
  if (to === 10) return String(dec);
  var r = ''; while (dec > 0) { r = map[dec % to] + r; dec = Math.floor(dec / to); } return r || '0';
};
Hh.async = function (fn) { return function (v) { return Promise.resolve().then(function () { return fn(v); }); }; };
Hh.sha = function (s, algo) {
  if (!crypto || !crypto.subtle) return Promise.reject(new Error('当前环境不支持加密计算（需 https）'));
  return crypto.subtle.digest(algo, new TextEncoder().encode(s)).then(function (buf) {
    return Array.prototype.map.call(new Uint8Array(buf), function (x) { return x.toString(16).padStart(2, '0'); }).join('');
  });
};

  var crc = 0xFFFFFFFF;
  for (var i = 0; i < s.length; i++) { crc = (crc >>> 8) ^ table[(crc ^ s.charCodeAt(i)) & 0xFF]; }
  return (crc ^ 0xFFFFFFFF) >>> 0;
};
