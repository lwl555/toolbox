/* ============================================================
   26-ai-chat.js — AI 对话（真实大模型，用户填 Key 前端 fetch OpenAI 兼容接口）
   所有工具 init 模式，自渲染聊天 UI；支持流式输出。
   ============================================================ */
var PROVIDERS = {
  deepseek: { base: 'https://api.deepseek.com/v1', models: ['deepseek-chat', 'deepseek-reasoner'] },
  openai: { base: 'https://api.openai.com/v1', models: ['gpt-4o-mini', 'gpt-4o', 'o1-mini'] },
  moonshot: { base: 'https://api.moonshot.cn/v1', models: ['moonshot-v1-8k', 'moonshot-v1-32k'] },
  zhipu: { base: 'https://open.bigmodel.cn/api/paas/v4', models: ['glm-4-flash', 'glm-4-plus'] }
};

/* 流式对话核心 */
function chatReq(base, key, model, sys, hist, onTok, onErr, onDone) {
  fetch(base + '/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
    body: JSON.stringify({ model: model, stream: true, messages: [{ role: 'system', content: sys }].concat(hist) })
  }).then(function (r) {
    if (!r.ok) return r.text().then(function (t) { throw new Error('API ' + r.status + '：' + t.slice(0, 160)); });
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    function step() {
      return reader.read().then(function (res) {
        if (res.done) { onDone && onDone(); return; }
        buf += dec.decode(res.value, { stream: true });
        var lines = buf.split('\n'); buf = lines.pop();
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();
          if (!line || line.indexOf('data:') !== 0) continue;
          var d = line.slice(5).trim();
          if (d === '[DONE]') { onDone && onDone(); return; }
          try { var j = JSON.parse(d); var tok = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content; if (tok) onTok(tok); } catch (e) { }
        }
        return step();
      });
    }
    return step();
  }).catch(function (e) { onErr && onErr(e.message); });
}

/* 通用聊天 UI 构建 */
function buildChat(host, RT, cfg) {
  var sys = cfg.sys || '你是一个乐于助人的AI助手。';
  host.innerHTML = '<div class="pane-box"><div class="pane-bd">' +
    '<div style="margin-bottom:8px"><label>服务商 </label><select id="prov" class="ipt">' +
    '<option value="deepseek">DeepSeek</option><option value="openai">OpenAI</option><option value="moonshot">Kimi</option><option value="zhipu">智谱 GLM</option><option value="custom">自定义</option></select></div>' +
    '<div style="margin-bottom:8px"><input id="key" class="ipt" type="password" placeholder="填入 API Key（仅本机，不上传）"></div>' +
    '<div style="margin-bottom:8px" id="basebox" style="display:none"><input id="base" class="ipt" placeholder="自定义 base url，如 https://x/v1"></div>' +
    '<div style="margin-bottom:8px"><label>模型 </label><input id="model" class="ipt" value="' + (PROVIDERS.deepseek.models[0]) + '"></div>' +
    '<div id="log" style="border:1px solid var(--bd);border-radius:10px;padding:10px;height:240px;overflow:auto;background:var(--bg-soft);margin-bottom:8px"></div>' +
    '<div style="display:flex;gap:6px"><textarea id="msg" class="ipt" rows="2" placeholder="输入消息，回车发送" style="flex:1"></textarea><button id="send" class="btn">发送</button></div>' +
    '<div id="st" style="color:var(--ink-4);margin-top:6px"></div></div></div>';
  function syncModel() {
    var p = host.querySelector('#prov').value;
    if (p === 'custom') { host.querySelector('#base').parentNode.style.display = ''; return; }
    host.querySelector('#base').parentNode.style.display = 'none';
    host.querySelector('#model').value = PROVIDERS[p].models[0];
  }
  host.querySelector('#prov').onchange = syncModel;
  syncModel();
  var hist = [];
  function add(role, text) {
    var box = host.querySelector('#log');
    var d = document.createElement('div');
    d.style.cssText = 'margin:6px 0;padding:8px 10px;border-radius:10px;max-width:90%;white-space:pre-wrap;line-height:1.5';
    if (role === 'user') { d.style.cssText += 'margin-left:auto;background:var(--brand);color:#fff'; }
    else { d.style.cssText += 'background:#fff;border:1px solid var(--bd)'; }
    d.textContent = (role === 'user' ? '我：' : 'AI：') + text;
    box.appendChild(d); box.scrollTop = box.scrollHeight;
    return d;
  }
  host.querySelector('#msg').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); host.querySelector('#send').click(); } });
  host.querySelector('#send').onclick = function () {
    var key = host.querySelector('#key').value.trim();
    var p = host.querySelector('#prov').value;
    var base = p === 'custom' ? host.querySelector('#base').value.trim() : PROVIDERS[p].base;
    var model = host.querySelector('#model').value.trim();
    var text = host.querySelector('#msg').value.trim();
    if (!key) { RT.toast('请先填入 API Key'); return; }
    if (!text) return;
    host.querySelector('#msg').value = '';
    add('user', text); hist.push({ role: 'user', content: text });
    var node = add('assistant', '');
    host.querySelector('#st').textContent = '思考中…';
    var full = '';
    chatReq(base, key, model, sys, hist, function (tok) { full += tok; node.textContent = 'AI：' + full; host.querySelector('#log').scrollTop = 1e9; },
      function (err) { node.textContent = 'AI：⚠️ ' + err; host.querySelector('#st').textContent = '出错'; },
      function () { host.querySelector('#st').textContent = '完成'; hist.push({ role: 'assistant', content: full }); });
  };
}
