<script>
/* 学习 / 记忆 — 12 个 */
var Lr = {};
Lr.words = [['apple', '苹果'], ['banana', '香蕉'], ['computer', '电脑'], ['happy', '开心'], ['science', '科学'], ['knowledge', '知识'], ['student', '学生'], ['teacher', '老师'], ['language', '语言'], ['memory', '记忆'], ['practice', '练习'], ['progress', '进步'], ['future', '未来'], ['dream', '梦想'], ['friend', '朋友'], ['family', '家庭'], ['health', '健康'], ['success', '成功'], ['courage', '勇气'], ['wisdom', '智慧'], ['nature', '自然'], ['travel', '旅行'], ['music', '音乐'], ['book', '书'], ['time', '时间'], ['world', '世界'], ['idea', '想法'], ['skill', '技能'], ['goal', '目标'], ['habit', '习惯']];


window.TOOL = { id: "learn-ebb", n: "艾宾浩斯复习", c: "learn", d: "输入学习日，算出最佳复习时间点",
  custom: null,
  fields: [{"k":"date","t":"学习日期","type":"text","v":"2026-09-01"},{"k":"out","t":"复习计划","type":"out","dl":1,"mono":1,"metrics":1}],
  auto: true,
  first: true,
  init: null,
  run: function (v) { var m = (v.date || '').match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/); if (!m) return { out: '', note: '格式如 2026-09-01', warn: true }; var d = new Date(+m[1], +m[2] - 1, +m[3]); var days = [1, 2, 4, 7, 15, 30]; var r = days.map(function (n) { var x = new Date(d); x.setDate(x.getDate() + n); return '第 ' + n + ' 天（' + x.toISOString().slice(0, 10) + '）'; }); return { out: r.join('\n'), metrics: [{ t: '复习点', v: days.length + ' 次' }] }; } };
var FK='toolbox_fav_v2';
function sy(){try{return JSON.parse(localStorage.getItem(FK)||'[]')}catch(e){return[]}}
var fv=document.getElementById('fv');
function rf(){fv.classList.toggle('on',sy().indexOf("learn-ebb")>=0)}
rf();fv.onclick=function(){var f=sy(),i=f.indexOf("learn-ebb");
if(i>=0)f.splice(i,1);else f.push("learn-ebb");
localStorage.setItem(FK,JSON.stringify(f));rf()};
var UK='toolbox_used_v2';
try{var u=JSON.parse(localStorage.getItem(UK)||'[]');u=u.filter(function(x){return x!=="learn-ebb"});u.unshift("learn-ebb");localStorage.setItem(UK,JSON.stringify(u.slice(0,12)))}catch(e){}
RT.boot(window.TOOL);
</script>
