<script>
/* 单位换算 — 28 个 */
var Ch = {};
Ch.lin = function (v, from, to, units) { var f = units[from], t = units[to]; if (!f || !t) return null; return v * f / t; };
Ch.opt = function (obj) { return Object.keys(obj).map(function (k) { return { v: k, t: obj[k].t }; }); };


window.TOOL = { id: "cvt-currency", n: "货币换算（参考）", c: "convert", d: "按内置参考汇率换算，非实时，仅估算",
  custom: null,
  fields: [{"k":"v","t":"金额","type":"number","v":100},{"k":"from","t":"从","type":"select","opts":[{"v":"CNY","t":"人民币 CNY"},{"v":"USD","t":"美元 USD"},{"v":"EUR","t":"欧元 EUR"},{"v":"JPY","t":"日元 JPY"},{"v":"HKD","t":"港币 HKD"},{"v":"GBP","t":"英镑 GBP"}]},{"k":"to","t":"到","type":"select","opts":[{"v":"CNY","t":"人民币 CNY"},{"v":"USD","t":"美元 USD"},{"v":"EUR","t":"欧元 EUR"},{"v":"JPY","t":"日元 JPY"},{"v":"HKD","t":"港币 HKD"},{"v":"GBP","t":"英镑 GBP"}]},{"k":"out","t":"结果","type":"out","dl":1,"mono":1,"note":"参考汇率：1 USD≈7.2 CNY，1 EUR≈7.8，1 JPY≈0.048，1 HKD≈0.92，1 GBP≈9.1（非实时）"}],
  auto: true,
  first: true,
  init: null,
  run: function (v) { var R = { CNY: 1, USD: 7.2, EUR: 7.8, JPY: 0.048, HKD: 0.92, GBP: 9.1 }; var cny = v.v * R[v.from]; return { out: (cny / R[v.to]).toFixed(2) + ' ' + v.to }; } };
var FK='toolbox_fav_v2';
function sy(){try{return JSON.parse(localStorage.getItem(FK)||'[]')}catch(e){return[]}}
var fv=document.getElementById('fv');
function rf(){fv.classList.toggle('on',sy().indexOf("cvt-currency")>=0)}
rf();fv.onclick=function(){var f=sy(),i=f.indexOf("cvt-currency");
if(i>=0)f.splice(i,1);else f.push("cvt-currency");
localStorage.setItem(FK,JSON.stringify(f));rf()};
var UK='toolbox_used_v2';
try{var u=JSON.parse(localStorage.getItem(UK)||'[]');u=u.filter(function(x){return x!=="cvt-currency"});u.unshift("cvt-currency");localStorage.setItem(UK,JSON.stringify(u.slice(0,12)))}catch(e){}
RT.boot(window.TOOL);
</script>
