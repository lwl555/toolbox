Rh.hex = function (n) { var s = ''; for (var i = 0; i < n; i++) s += '0123456789abcdef'[Math.floor(Math.random() * 16)]; return s; };


window.TOOL = { id: "rnd-str", n: "随机字符串", c: "random", d: "生成指定长度和字符集的随机串",

localStorage.setItem(FK,JSON.stringify(f));rf()};

try{var u=JSON.parse(localStorage.getItem(UK)||'[]');u=u.filter(function(x){return x!=="rnd-str"});u.unshift("rnd-str");localStorage.setItem(UK,JSON.stringify(u.slice(0,12)))}catch(e){}
RT.boot(window.TOOL);
