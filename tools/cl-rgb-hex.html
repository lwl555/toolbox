/* 颜色 / 设计 — 26 个 */
var Cl = {};
Cl.hex2rgb = function (h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(function (x) { return x + x; }).join(''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };
Cl.rgb2hex = function (r, g, b) { function h(x) { return ('0' + Math.round(x).toString(16)).slice(-2); } return '#' + h(r) + h(g) + h(b); };
Cl.rgb2hsl = function (r, g, b) { r /= 255; g /= 255; b /= 255; var mx = Math.max(r, g, b), mn = Math.min(r, g, b), h, s, l = (mx + mn) / 2; if (mx === mn) { h = s = 0; } else { var d = mx - mn; s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn); switch (mx) { case r: h = (g - b) / d + (g < b ? 6 : 0); break; case g: h = (b - r) / d + 2; break; default: h = (r - g) / d + 4; } h /= 6; } return [Math.round(h * 360), Math.round(s * 100), Math.round(l * 100)]; };
Cl.hsl2rgb = function (h, s, l) { s /= 100; l /= 100; var c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2, r = 0, g = 0, b = 0; if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; } else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; } return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)]; };
Cl.relLum = function (r, g, b) { function f(c) { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); } return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b); };
Cl.contrast = function (c1, c2) { var l1 = Cl.relLum.apply(null, c1), l2 = Cl.relLum.apply(null, c2); var hi = Math.max(l1, l2), lo = Math.min(l1, l2); return (hi + 0.05) / (lo + 0.05); };
Cl.mix = function (a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; };
Cl.sw = function (c) { return '<span style="display:inline-block;width:18px;height:18px;border-radius:4px;background:' + Cl.rgb2hex.apply(null, c) + ';vertical-align:middle;margin-right:4px;border:1px solid rgba(0,0,0,.1)"></span>'; };
Cl.scheme = function (hex, type) { var rgb = Cl.hex2rgb(hex), hsl = Cl.rgb2hsl.apply(null, rgb), h = hsl[0], r = []; var adds = { comp: [180], analogic: [-30, 30], triadic: [120, 240], split: [150, 210], tetradic: [90, 180, 270], mono: [0, 0, 0] }; var list = type === 'mono' ? [hsl, [hsl[0], hsl[1], Math.min(95, hsl[2] + 20)], [hsl[0], hsl[1], Math.max(10, hsl[2] - 20)]] : adds[type].map(function (a) { return [((h + a) % 360 + 360) % 360, hsl[1], hsl[2]]; }); list.forEach(function (h2) { r.push(Cl.hsl2rgb.apply(null, h2)); }); return r; };


window.TOOL = { id: "cl-rgb-hex", n: "RGB 转 HEX", c: "color", d: "RGB 转十六进制",
  custom: null,
  fields: [{"k":"r","t":"R","type":"number","v":26,"min":0,"max":255},{"k":"g","t":"G","type":"number","v":107,"min":0,"max":255},{"k":"b","t":"B","type":"number","v":85,"min":0,"max":255},{"k":"out","t":"结果","type":"out","dl":1,"mono":1,"metrics":1}],
  auto: true,
  first: true,
