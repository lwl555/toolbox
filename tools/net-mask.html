<script>
/* 网络 / 环境 — 16 个 */
var Nt = {};
Nt.cidr = function (ip, bits) { var p = ip.split('.').map(Number); var mask = bits === 32 ? 0xffffffff : (0xffffffff << (32 - bits)) >>> 0; var ipn = (p[0] << 24) + (p[1] << 16) + (p[2] << 8) + p[3]; var net = (ipn & mask) >>> 0; var broad = (net | (~mask >>> 0)) >>> 0; function toIp(n) { return [(n >>> 24) & 255, (n >> 16) & 255, (n >> 8) & 255, n & 255].join('.'); } return { net: toIp(net), broad: toIp(broad), first: toIp(net + 1), last: toIp(broad - 1), hosts: bits >= 31 ? 0 : (broad - net - 1) }; };


window.TOOL = { id: "net-mask", n: "子网掩码换算", c: "network", d: "掩码与 CIDR 位数互转",
  custom: null,
  fields: [{"k":"in","t":"掩码(如 255.255.255.0) 或 /24","type":"text","v":"255.255.255.0"},{"k":"out","t":"结果","type":"out","dl":1,"mono":1}],
  auto: true,
  first: true,
  init: null,
  run: function (v) { var s = v.in.trim(); if (s[0] === '/') { var b = +s.slice(1); var mask = (b === 32 ? 0xffffffff : (0xffffffff << (32 - b)) >>> 0); var ip = [(mask >>> 24) & 255, (mask >> 16) & 255, (mask >> 8) & 255, mask & 255].join('.'); return { out: '掩码：' + ip + '（/' + b + '）' }; } var p = s.split('.').map(Number); var n = (p[0] << 24) + (p[1] << 16) + (p[2] << 8) + p[3]; var bits = 0; for (var i = 31; i >= 0; i--) if (n & (1 << i)) bits++; else break; return { out: s + ' 对应 /' + bits }; } };
var FK='toolbox_fav_v2';
function sy(){try{return JSON.parse(localStorage.getItem(FK)||'[]')}catch(e){return[]}}
var fv=document.getElementById('fv');
function rf(){fv.classList.toggle('on',sy().indexOf("net-mask")>=0)}
rf();fv.onclick=function(){var f=sy(),i=f.indexOf("net-mask");
if(i>=0)f.splice(i,1);else f.push("net-mask");
localStorage.setItem(FK,JSON.stringify(f));rf()};
var UK='toolbox_used_v2';
try{var u=JSON.parse(localStorage.getItem(UK)||'[]');u=u.filter(function(x){return x!=="net-mask"});u.unshift("net-mask");localStorage.setItem(UK,JSON.stringify(u.slice(0,12)))}catch(e){}
RT.boot(window.TOOL);
</script>
