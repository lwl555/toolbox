  run: function (v) { var p = (v.in || '').trim(); var svc = Dh.PORTS[p]; if (svc) return { out: p + ' → ' + svc, metrics: [{ t: '服务', v: svc }] }; return { out: p + ' 未收录常见服务', note: '常见端口：80/443/22/3306/6379/5432' }; } });

tool({ id: 'dev-curl', n: '生成 curl 命令', c: 'dev', d: '按表单生成 curl 请求（GET/POST）',
  f: [{ k: 'url', t: 'URL', type: 'text', ph: 'https://api.example.com/user' }, { k: 'method', t: '方法', type: 'select', opts: [{ v: 'GET', t: 'GET' }, { v: 'POST', t: 'POST' }, { v: 'PUT', t: 'PUT' }, { v: 'DELETE', t: 'DELETE' }] }, { k: 'body', t: 'JSON 请求体（POST/PUT用）', type: 'textarea', rows: 3, mono: 1, ph: '{"name":"小明"}' }, { k: 'out', t: 'curl', type: 'out', dl: 1, mono: 1 }],
  run: function (v) { var c = 'curl -X ' + v.method + ' "' + v.url + '"'; c += ' -H "Content-Type: application/json"'; if (v.body && /POST|PUT/.test(v.method)) c += ' -d \'' + (v.body || '') + '\''; return { out: c }; } });

tool({ id: 'dev-fetch', n: '生成 fetch 代码', c: 'dev', d: '把请求参数转成 JS fetch 片段',
  f: [{ k: 'url', t: 'URL', type: 'text', ph: 'https://api.example.com/user' }, { k: 'method', t: '方法', type: 'select', opts: [{ v: 'GET', t: 'GET' }, { v: 'POST', t: 'POST' }] }, { k: 'body', t: 'JSON 体（POST用）', type: 'textarea', rows: 3, mono: 1 }, { k: 'out', t: '代码', type: 'out', dl: 1, mono: 1 }],
  run: function (v) { var code = "fetch('" + v.url + "', {\n  method: '" + v.method + "',\n  headers: { 'Content-Type': 'application/json' }" + (v.body && v.method === 'POST' ? ",\n  body: JSON.stringify(" + v.body + ")" : "") + "\n})\n  .then(r => r.json())\n  .then(data => console.log(data));"; return { out: code }; } });

tool({ id: 'dev-ascii', n: 'ASCII 码表', c: 'dev', d: '打印完整 ASCII 可打印字符对照',
  f: [{ k: 'out', t: '码表', type: 'out', dl: 1, mono: 1 }],
  run: function (v) { var r = []; for (var i = 32; i < 127; i++) r.push((i < 100 ? ' ' : '') + i + ':' + String.fromCharCode(i)); return { out: r.join('  ') }; } });

tool({ id: 'dev-jsonpath', n: 'JSON 路径提取', c: 'dev', d: '用 a.b.0 路径从 JSON 取值',
  f: [{ k: 'in', t: 'JSON', type: 'textarea', mono: 1, ph: '{"user":{"name":"小明","tags":["a","b"]}}' }, { k: 'path', t: '路径', type: 'text', ph: 'user.tags.1' }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1 }],
  run: function (v) { var o = Dh.tryJSON(v.in); if (o == null) return { out: '', note: 'JSON 解析失败', warn: true }; var cur = o; var ok = true; (v.path || '').split('.').forEach(function (k) { if (cur == null) { ok = false; return; } cur = cur[k]; }); if (!ok || cur === undefined) return { out: '', note: '路径不存在', warn: true }; return { out: typeof cur === 'object' ? JSON.stringify(cur, null, 2) : '' + cur }; } });

tool({ id: 'dev-lines', n: '代码行数统计', c: 'dev', d: '统计代码行数（含注释/空行）',
  f: [{ k: 'in', t: '代码', type: 'textarea', mono: 1, ph: '// 注释\nfunction a(){}\n' }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1, metrics: 1 }],
  run: function (v) { var lines = (v.in || '').split('\n'); var total = lines.length; var blank = lines.filter(function (l) { return !l.trim(); }).length; var comment = lines.filter(function (l) { return /^\s*(\/\/|#|--|\/\*)/.test(l); }).length; return { out: '总行数：' + total, metrics: [{ t: '总行', v: total }, { t: '空行', v: blank }, { t: '注释行', v: comment }, { t: '代码行', v: total - blank - comment }] }; } });

tool({ id: 'dev-uuid-list', n: '批量 UUID', c: 'dev', d: '一次生成多个 UUID（调试用）',
  f: [{ k: 'n', t: '数量', type: 'number', v: 10, min: 1, max: 100 }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1 }],
  auto: false, run: function (v) { var r = []; for (var i = 0; i < v.n; i++) r.push('xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) { var x = Math.random() * 16 | 0; return (c === 'x' ? x : (x & 0x3 | 0x8)).toString(16); })); return { out: r.join('\n') }; } });

tool({ id: 'dev-random-ua', n: '随机 UA 生成', c: 'dev', d: '生成一个逼真的随机 User-Agent',
  f: [{ k: 'out', t: '结果', type: 'out', dl: 1, mono: 1 }], auto: false,
  run: function (v) { var ver = 100 + Math.floor(Math.random() * 40); var ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/' + ver + '.0.0.0 Safari/537.36'; return { out: ua }; } });

tool({ id: 'dev-query-build', n: 'Query 参数拼接', c: 'dev', d: '把键值对拼成 URL 查询字符串',
  f: [{ k: 'in', t: '每行 键=值', type: 'textarea', ph: 'page=1\nq=hello' }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1 }],
  run: function (v) { var ps = []; (v.in || '').split('\n').forEach(function (l) { var p = l.split('='); if (p.length >= 2) ps.push(encodeURIComponent(p[0].trim()) + '=' + encodeURIComponent(p.slice(1).join('=').trim())); }); return { out: ps.join('&') }; } });


window.TOOL = (function () { var t = (typeof T !== 'undefined') ? T.filter(function (x) { return x.id === "dev-fetch"; })[0] : null; if (t && !t.fields) t.fields = t.f; return t; })();
if (!window.TOOL) { console.error('tool not found: dev-fetch'); }
var FK='toolbox_fav_v2';
function sy(){try{return JSON.parse(localStorage.getItem(FK)||'[]')}catch(e){return[]}}
var fv=document.getElementById('fv');
function rf(){fv.classList.toggle('on',sy().indexOf("dev-fetch")>=0)}
rf();fv.onclick=function(){var f=sy(),i=f.indexOf("dev-fetch");
if(i>=0)f.splice(i,1);else f.push("dev-fetch");
localStorage.setItem(FK,JSON.stringify(f));rf()};
var UK='toolbox_used_v2';
try{var u=JSON.parse(localStorage.getItem(UK)||'[]');u=u.filter(function(x){return x!=="dev-fetch"});u.unshift("dev-fetch");localStorage.setItem(UK,JSON.stringify(u.slice(0,24)))}catch(e){}
/* 顶部栏滚动阴影（与首页一致） */
(function(){
  var top=document.querySelector('.tool-top');
  if(!top)return;
  function onS(){top.classList.toggle('scrolled', window.scrollY>4)}
  window.addEventListener('scroll',onS,{passive:true});onS();
})();
RT.boot(window.TOOL);
</script>
