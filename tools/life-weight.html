<script>
/* 生活 / 效率 — 24 个 */
var Lf = {};
Lf.quote = ['行动是治愈恐惧的良药。', '今天的事今天做。', '你只管努力，剩下交给时间。', '种一棵树最好的时间是十年前，其次是现在。', '自律给你自由。', '把简单的事做好就是不简单。', '保持热爱，奔赴山海。', '慢慢来，比较快。', '不为失败找理由，只为成功找方法。', '越努力越幸运。', '细节决定成败。', '坚持就是胜利。'];
Lf.tip = ['每天喝够 8 杯水。', '久坐一小时起来活动 2 分钟。', '睡前半小时远离屏幕。', '饭后散步 15 分钟助消化。', '用眼 20 分钟看远处 20 秒。', '早睡早起精神好。', '每周运动 3 次以上。', '多吃蔬菜水果少吃油。', '保持微笑，心情更好。', '工作 25 分钟休息 5 分钟。'];
Lf.pomodoroState = null;
Lf.stopwatch = null;


window.TOOL = { id: "life-weight", n: "体重记录", c: "life", d: "记录每日体重，看变化趋势",
  custom: null,
  fields: [{"k":"cv","t":"记录","type":"custom","html":"<div style=\"display:flex;gap:8px;margin-bottom:10px\"><input id=\"wIn\" class=\"ipt\" type=\"number\" placeholder=\"今日体重kg\" style=\"flex:1\"><button id=\"wAdd\" class=\"btn btn-pri\">记录</button></div><div id=\"wList\" style=\"font-size:13px\"></div>"}],
  auto: true,
  first: true,
  init: function (RT) {
    var KEY = 'life_weight_v2'; var inp = document.getElementById('wIn'), add = document.getElementById('wAdd'), list = document.getElementById('wList');
    function load() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } }
    function save(a) { localStorage.setItem(KEY, JSON.stringify(a)); }
    function render() { var a = load(); if (!a.length) { list.innerHTML = '<div style="color:var(--ink-3)">暂无记录</div>'; return; } var first = a[0].w, last = a[a.length - 1].w; var diff = (last - first).toFixed(1); list.innerHTML = '<div style="margin-bottom:6px">共 ' + a.length + ' 条，变化 <b style="color:' + (diff <= 0 ? '#1a6b55' : '#9b1c1c') + '">' + (diff > 0 ? '+' : '') + diff + ' kg</b></div>' + a.slice(-8).reverse().map(function (r) { return '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--ink-1)"><span>' + r.d + '</span><b>' + r.w + ' kg</b></div>'; }).join(''); }
    add.onclick = function () { if (!inp.value) return; var a = load(); a.push({ d: new Date().toLocaleDateString(), w: parseFloat(inp.value) }); save(a); inp.value = ''; render(); };
    render();
  },
  run: function () {} };
var FK='toolbox_fav_v2';
function sy(){try{return JSON.parse(localStorage.getItem(FK)||'[]')}catch(e){return[]}}
var fv=document.getElementById('fv');
function rf(){fv.classList.toggle('on',sy().indexOf("life-weight")>=0)}
rf();fv.onclick=function(){var f=sy(),i=f.indexOf("life-weight");
if(i>=0)f.splice(i,1);else f.push("life-weight");
localStorage.setItem(FK,JSON.stringify(f));rf()};
var UK='toolbox_used_v2';
try{var u=JSON.parse(localStorage.getItem(UK)||'[]');u=u.filter(function(x){return x!=="life-weight"});u.unshift("life-weight");localStorage.setItem(UK,JSON.stringify(u.slice(0,12)))}catch(e){}
RT.boot(window.TOOL);
</script>
</body>
