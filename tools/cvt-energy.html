  f: [{ k: 'v', t: '数值', type: 'number', v: 10 }, { k: 'from', t: '从', type: 'select', opts: [{ v: 'db', t: '分贝 dB（功率）' }, { v: 'ratio', t: '功率比' }, { v: 'dbv', t: '分贝 dB（电压）' }, { v: 'vratio', t: '电压比' }] }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1 }],
  run: function (v) {
    if (v.from === 'db') return { out: Math.pow(10, v.v / 10).toFixed(4) + ' 倍' };
    if (v.from === 'dbv') return { out: Math.pow(10, v.v / 20).toFixed(4) + ' 倍' };
    if (v.from === 'ratio') return { out: (10 * Math.log10(v.v)).toFixed(3) + ' dB' };
    return { out: (20 * Math.log10(v.v)).toFixed(3) + ' dB' };
  } });

tool({ id: 'cvt-data-time', n: '下载时间估算', c: 'convert', d: '按文件大小和网速估算下载耗时',
  f: [{ k: 'size', t: '文件大小', type: 'number', v: 1 }, { k: 'unit', t: '大小单位', type: 'select', opts: [{ v: 'MB', t: 'MB' }, { v: 'GB', t: 'GB' }] }, { k: 'speed', t: '网速 (Mbps)', type: 'number', v: 100 }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1 }],
  run: function (v) { var bytes = v.size * (v.unit === 'GB' ? 1073741824 : 1048576); var bits = bytes * 8; var sec = bits / (v.speed * 1e6); var m = Math.floor(sec / 60), s = Math.round(sec % 60); return { out: m + ' 分 ' + s + ' 秒', metrics: [{ t: '约', v: sec.toFixed(1) + ' 秒' }] }; } });

tool({ id: 'cvt-cup-vol', n: '烹饪量换算', c: 'convert', d: '杯/汤匙/茶匙与毫升互转',
  f: [{ k: 'v', t: '数值', type: 'number', v: 1 }, { k: 'from', t: '从', type: 'select', opts: [{ v: 'cup', t: '杯(美)' }, { v: 'tbsp', t: '汤匙 tbsp' }, { v: 'tsp', t: '茶匙 tsp' }, { v: 'ml', t: '毫升' }] }, { k: 'to', t: '到', type: 'select', opts: [{ v: 'cup', t: '杯' }, { v: 'tbsp', t: '汤匙' }, { v: 'tsp', t: '茶匙' }, { v: 'ml', t: '毫升' }] }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1 }],
  run: function (v) { var F = { cup: 236.588, tbsp: 14.787, tsp: 4.929, ml: 1 }; var ml = v.v * F[v.from]; return { out: (ml / F[v.to]).toFixed(3) + '' }; } });

tool({ id: 'cvt-currency', n: '货币换算（参考）', c: 'convert', d: '按内置参考汇率换算，非实时，仅估算',
  f: [{ k: 'v', t: '金额', type: 'number', v: 100 }, { k: 'from', t: '从', type: 'select', opts: [{ v: 'CNY', t: '人民币 CNY' }, { v: 'USD', t: '美元 USD' }, { v: 'EUR', t: '欧元 EUR' }, { v: 'JPY', t: '日元 JPY' }, { v: 'HKD', t: '港币 HKD' }, { v: 'GBP', t: '英镑 GBP' }] }, { k: 'to', t: '到', type: 'select', opts: [{ v: 'CNY', t: '人民币 CNY' }, { v: 'USD', t: '美元 USD' }, { v: 'EUR', t: '欧元 EUR' }, { v: 'JPY', t: '日元 JPY' }, { v: 'HKD', t: '港币 HKD' }, { v: 'GBP', t: '英镑 GBP' }] }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1, note: '参考汇率：1 USD≈7.2 CNY，1 EUR≈7.8，1 JPY≈0.048，1 HKD≈0.92，1 GBP≈9.1（非实时）' }],
  run: function (v) { var R = { CNY: 1, USD: 7.2, EUR: 7.8, JPY: 0.048, HKD: 0.92, GBP: 9.1 }; var cny = v.v * R[v.from]; return { out: (cny / R[v.to]).toFixed(2) + ' ' + v.to }; } });

tool({ id: 'cvt-bytes-read', n: '字节可读化', c: 'convert', d: '把字节数转成 KB/MB/GB 易读形式',
  f: [{ k: 'b', t: '字节数', type: 'number', v: 1048576 }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1, metrics: 1 }],
  run: function (v) { var b = v.b, r; if (b < 1024) r = b + ' B'; else if (b < 1048576) r = (b / 1024).toFixed(2) + ' KB'; else if (b < 1073741824) r = (b / 1048576).toFixed(2) + ' MB'; else r = (b / 1073741824).toFixed(2) + ' GB'; return { out: r, metrics: [{ t: 'B', v: b }, { t: 'KB', v: (b / 1024).toFixed(2) }, { t: 'MB', v: (b / 1048576).toFixed(3) }] }; } });

tool({ id: 'cvt-brightness', n: '亮度换算', c: 'convert', d: '尼特 nit 与英尺朗伯 fL 互转',
  f: [{ k: 'v', t: '数值', type: 'number', v: 300 }, { k: 'from', t: '从', type: 'select', opts: [{ v: 'nit', t: '尼特 nit' }, { v: 'fl', t: '英尺朗伯 fL' }] }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1 }],
  run: function (v) { var r = v.from === 'nit' ? v.v / 3.426 : v.v * 3.426; return { out: r.toFixed(2) + (v.from === 'nit' ? ' fL' : ' nit') }; } });

tool({ id: 'cvt-ppi', n: '屏幕 PPI 计算', c: 'convert', d: '按分辨率和尺寸算屏幕像素密度 PPI',
  f: [{ k: 'w', t: '宽像素', type: 'number', v: 1920 }, { k: 'h', t: '高像素', type: 'number', v: 1080 }, { k: 'inch', t: '对角线英寸', type: 'number', v: 23.8 }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1 }],
  run: function (v) { var ppi = Math.sqrt(v.w * v.w + v.h * v.h) / v.inch; return { out: ppi.toFixed(1) + ' PPI', metrics: [{ t: 'PPI', v: ppi.toFixed(1) }, { t: '清晰度', v: ppi > 200 ? '视网膜级' : ppi > 120 ? '清晰' : '普通' }] }; } });


window.TOOL = (function () { var t = (typeof T !== 'undefined') ? T.filter(function (x) { return x.id === "cvt-energy"; })[0] : null; if (t && !t.fields) t.fields = t.f; return t; })();
