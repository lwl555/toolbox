<script>
/* 单位换算 — 28 个 */
var Ch = {};
Ch.lin = function (v, from, to, units) { var f = units[from], t = units[to]; if (!f || !t) return null; return v * f / t; };
Ch.opt = function (obj) { return Object.keys(obj).map(function (k) { return { v: k, t: obj[k].t }; }); };


window.TOOL = { id: "cvt-shoe", n: "鞋码换算", c: "convert", d: "中国/欧洲/美国/英国鞋码互转（以欧码为基准）",
  custom: null,
  fields: [{"k":"v","t":"中国码(内长mm)","type":"number","v":250},{"k":"out","t":"结果","type":"out","dl":1,"mono":1,"metrics":1}],
  auto: true,
  first: true,
  init: null,
  run: function (v) { var eu = v.v - 1.5 * 5 / 2 * 2; var euCode = Math.round(v.v / 6.67); var us = Math.round((v.v - 230) / 6.67 + 0.5); var uk = us - 1; return { out: 'EU ' + euCode, metrics: [{ t: '中国码', v: v.v + ' mm' }, { t: '欧洲码 EU', v: euCode }, { t: '美国码 US', v: us }, { t: '英国码 UK', v: uk }] }; } };
var FK='toolbox_fav_v2';
function sy(){try{return JSON.parse(localStorage.getItem(FK)||'[]')}catch(e){return[]}}
var fv=document.getElementById('fv');
function rf(){fv.classList.toggle('on',sy().indexOf("cvt-shoe")>=0)}
rf();fv.onclick=function(){var f=sy(),i=f.indexOf("cvt-shoe");
if(i>=0)f.splice(i,1);else f.push("cvt-shoe");
localStorage.setItem(FK,JSON.stringify(f));rf()};
var UK='toolbox_used_v2';
try{var u=JSON.parse(localStorage.getItem(UK)||'[]');u=u.filter(function(x){return x!=="cvt-shoe"});u.unshift("cvt-shoe");localStorage.setItem(UK,JSON.stringify(u.slice(0,12)))}catch(e){}
RT.boot(window.TOOL);
</script>
