<div class="rel"><h4>同类工具</h4><div class="grid"><a class="card" href="md-audio.html"><div class="card-t"><span class="card-name">音频信息</span></div><div class="card-desc">读取时长 / 类型 / 体积。</div></a><a class="card" href="md-video.html"><div class="card-t"><span class="card-name">视频信息</span></div><div class="card-desc">读取时长 / 分辨率 / 体积。</div></a><a class="card" href="md-tone.html"><div class="card-t"><span class="card-name">生成音调</span></div><div class="card-desc">生成指定频率/时长的正弦音 WAV。</div></a><a class="card" href="md-noise.html"><div class="card-t"><span class="card-name">生成白噪声</span></div><div class="card-desc">生成随机白噪声 WAV，用于助眠/测试。</div></a><a class="card" href="md-beep.html"><div class="card-t"><span class="card-name">蜂鸣器</span></div><div class="card-desc">用 WebAudio 直接播放提示音。</div></a><a class="card" href="md-srt-shift.html"><div class="card-t"><span class="card-name">字幕时间轴偏移</span></div><div class="card-desc">整体平移 SRT 时间码（秒，可负）。</div></a></div></div>
</main>
<div class="foot"><div class="foot-in">

<div id="toast"></div>

<script src="../assets/runtime.js"></script>
<script>
/* ============================================================
   18-media.js — 音频 / 视频（元数据 + 本地生成 + 字幕）
   说明：浏览器无法无依赖转码音视频，故此分类聚焦“真实可做的”：
   元数据读取、WAV 音调/白噪声生成、蜂鸣、字幕时间轴处理。
   ============================================================ */

  
window.TOOL = { id: "md-batch", n: "媒体时长批量统计", c: "media", d: "多个音频/视频的时长汇总。",
  custom: null,
  fields: [{"k":"files","t":"媒体文件(多选)","type":"file","multi":true,"accept":"audio/*,video/*"},{"k":"out","t":"清单","type":"out","mono":true}],
  auto: true,
  first: true,
  init: null,
  run: function (v) {
      if (!v.files || !v.files.length) return { out: '' };
      var proms = v.files.map(function (f) {
        return new Promise(function (res) {
          var el = f.type.indexOf('video') >= 0 ? document.createElement('video') : document.createElement('audio');
          el.preload = 'metadata';
          el.onloadedmetadata = function () { res(f.name + '\t' + (el.duration ? el.duration.toFixed(1) + 's' : '?')); };
          el.onerror = function () { res(f.name + '\t读取失败'); };
          el.src = URL.createObjectURL(f);
        });
      });
      return Promise.all(proms).then(function (rows) {
        var total = rows.reduce(function (s, r) { var m = r.match(/([\d.]+)s$/); return s + (m ? +m[1] : 0); }, 0);
        return { out: rows.join('\n') + '\n合计时长：' + total.toFixed(1) + ' 秒' };
      });
    } };
var FK='toolbox_fav_v2';
function sy(){try{return JSON.parse(localStorage.getItem(FK)||'[]')}catch(e){return[]}}
var fv=document.getElementById('fv');
function rf(){fv.classList.toggle('on',sy().indexOf("md-batch")>=0)}
rf();fv.onclick=function(){var f=sy(),i=f.indexOf("md-batch");
if(i>=0)f.splice(i,1);else f.push("md-batch");
localStorage.setItem(FK,JSON.stringify(f));rf()};
var UK='toolbox_used_v2';
try{var u=JSON.parse(localStorage.getItem(UK)||'[]');u=u.filter(function(x){return x!=="md-batch"});u.unshift("md-batch");localStorage.setItem(UK,JSON.stringify(u.slice(0,12)))}catch(e){}
RT.boot(window.TOOL);
</script>
</body>
