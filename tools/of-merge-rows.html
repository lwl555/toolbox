<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Excel 多表合并 - 超有用的工具箱</title>
<meta name="description" content="同一文件多个工作表纵向合并成一个。。在线免费使用，文件不上传服务器。">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="tool-top"><div class="tool-top-in">
<a class="back" href="../index.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>返回</a>
<span class="tool-cat">办公文档</span>
<button class="tool-fav" id="fv" title="收藏">★</button>
</div></div>
<main class="pane">
<h1 class="tool-title" style="margin-bottom:6px">Excel 多表合并</h1>
<p class="lede">同一文件多个工作表纵向合并成一个。</p>
<div id="app"></div>
<div class="rel"><h4>同类工具</h4><div class="grid"><a class="card" href="of-csv-xlsx.html"><div class="card-t"><span class="card-name">CSV 转 Excel</span></div><div class="card-desc">CSV 转 .xlsx，可指定分隔符。</div></a><a class="card" href="of-xlsx-csv.html"><div class="card-t"><span class="card-name">Excel 转 CSV</span></div><div class="card-desc">首个工作表导出为 CSV。</div></a><a class="card" href="of-json-xlsx.html"><div class="card-t"><span class="card-name">JSON 转 Excel</span></div><div class="card-desc">数组型 JSON 转表格。</div></a><a class="card" href="of-xlsx-json.html"><div class="card-t"><span class="card-name">Excel 转 JSON</span></div><div class="card-desc">首个工作表转为 JSON 数组。</div></a><a class="card" href="of-xlsx-preview.html"><div class="card-t"><span class="card-name">Excel 预览</span></div><div class="card-desc">展示工作表名与首张表前 50 行内容。</div></a><a class="card" href="of-zip-pack.html"><div class="card-t"><span class="card-name">打包成 ZIP</span></div><div class="card-desc">多个文件打包为一个 zip。</div></a></div></div>
</main>
<div class="foot"><div class="foot-in">
<b>超有用的工具箱</b> · Excel 多表合并<br>
所有处理都在你的浏览器本地完成，文件不会上传到任何服务器 · <a href="../index.html">全部工具</a>
</div></div>
<div id="toast"></div>

<script src="../assets/runtime.js"></script>
<script>
/* ============================================================
   17-office.js — 表格 / 压缩包（SheetJS + JSZip，本地处理）
   ============================================================ */

  
window.TOOL = { id: "of-merge-rows", n: "Excel 多表合并", c: "office", d: "同一文件多个工作表纵向合并成一个。",
  custom: null,
  fields: [{"k":"file","t":"Excel 文件","type":"file","accept":".xlsx,.xls"},{"k":"outfile","t":"输出","type":"outfile"}],
  auto: true,
  first: true,
  init: null,
  run: function (v) {
      if (!v.file) return { note: '请选择 Excel', outfile: [] };
      return RT.lib(RT.CDN.XLSX).then(function () {
        return bufOf(v.file).then(function (b) {
          var wb = XLSX.read(b, { type: 'array' });
          var all = [];
          wb.SheetNames.forEach(function (nm) { XLSX.utils.sheet_to_json(wb.Sheets[nm], { defval: '' }).forEach(function (r) { all.push(r); }); });
          var ws = XLSX.utils.json_to_sheet(all), nb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(nb, ws, 'Merged');
          var out = XLSX.write(nb, { bookType: 'xlsx', type: 'array' });
          return { outfile: [{ name: 'merged.xlsx', blob: new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), size: out.byteLength }], note: '合并 ' + all.length + ' 行' };
        });
      });
    } };
var FK='toolbox_fav_v2';
function sy(){try{return JSON.parse(localStorage.getItem(FK)||'[]')}catch(e){return[]}}
var fv=document.getElementById('fv');
function rf(){fv.classList.toggle('on',sy().indexOf("of-merge-rows")>=0)}
rf();fv.onclick=function(){var f=sy(),i=f.indexOf("of-merge-rows");
if(i>=0)f.splice(i,1);else f.push("of-merge-rows");
localStorage.setItem(FK,JSON.stringify(f));rf()};
var UK='toolbox_used_v2';
try{var u=JSON.parse(localStorage.getItem(UK)||'[]');u=u.filter(function(x){return x!=="of-merge-rows"});u.unshift("of-merge-rows");localStorage.setItem(UK,JSON.stringify(u.slice(0,12)))}catch(e){}
RT.boot(window.TOOL);
</script>
</body>
</html>
