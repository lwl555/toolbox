<script>
/* 学习 / 记忆 — 12 个 */
var Lr = {};
Lr.words = [['apple', '苹果'], ['banana', '香蕉'], ['computer', '电脑'], ['happy', '开心'], ['science', '科学'], ['knowledge', '知识'], ['student', '学生'], ['teacher', '老师'], ['language', '语言'], ['memory', '记忆'], ['practice', '练习'], ['progress', '进步'], ['future', '未来'], ['dream', '梦想'], ['friend', '朋友'], ['family', '家庭'], ['health', '健康'], ['success', '成功'], ['courage', '勇气'], ['wisdom', '智慧'], ['nature', '自然'], ['travel', '旅行'], ['music', '音乐'], ['book', '书'], ['time', '时间'], ['world', '世界'], ['idea', '想法'], ['skill', '技能'], ['goal', '目标'], ['habit', '习惯']];


window.TOOL = { id: "learn-mindmap", n: "思维导图", c: "learn", d: "缩进大纲一键生成可折叠树状图",
  custom: null,
  fields: [{"k":"in","t":"大纲（用缩进表示层级）","type":"textarea","rows":8,"ph":"中心主题\n  分支一\n    子项A\n    子项B\n  分支二"},{"k":"out","t":"导图","type":"outhtml"}],
  auto: true,
  first: true,
  init: null,
  run: function (v) {
    var lines = (v.in || '').split('\n'); var html = '<div style="font-size:13px;line-height:1.8">'; var stack = [{ d: -1, el: '' }];
    function build(items) { var h = '<ul style="list-style:none;padding-left:16px;margin:4px 0;border-left:2px solid var(--ink-2)">'; items.forEach(function (it) { h += '<li style="margin:3px 0"><span style="background:var(--accent);color:#fff;padding:1px 8px;border-radius:6px;font-size:12px">' + RT.esc(it.t) + '</span>' + (it.children.length ? build(it.children) : '') + '</li>'; }); return h + '</ul>'; }
    var roots = [], cur = null, path = [];
    lines.forEach(function (l) { var indent = (l.match(/^\s*/) || [''])[0].length, t = l.trim(); if (!t) return; var node = { t: t, children: [] }; while (path.length && path[path.length - 1].indent >= indent) path.pop(); if (!path.length) roots.push(node); else path[path.length - 1].node.children.push(node); path.push({ indent: indent, node: node }); });
    html += build(roots) + '</div>';
    return { out: html };
  } };
var FK='toolbox_fav_v2';
function sy(){try{return JSON.parse(localStorage.getItem(FK)||'[]')}catch(e){return[]}}
var fv=document.getElementById('fv');
function rf(){fv.classList.toggle('on',sy().indexOf("learn-mindmap")>=0)}
rf();fv.onclick=function(){var f=sy(),i=f.indexOf("learn-mindmap");
if(i>=0)f.splice(i,1);else f.push("learn-mindmap");
localStorage.setItem(FK,JSON.stringify(f));rf()};
var UK='toolbox_used_v2';
try{var u=JSON.parse(localStorage.getItem(UK)||'[]');u=u.filter(function(x){return x!=="learn-mindmap"});u.unshift("learn-mindmap");localStorage.setItem(UK,JSON.stringify(u.slice(0,12)))}catch(e){}
RT.boot(window.TOOL);
</script>
