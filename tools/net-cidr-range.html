<script>
/* 网络 / 环境 — 16 个 */
var Nt = {};
Nt.cidr = function (ip, bits) { var p = ip.split('.').map(Number); var mask = bits === 32 ? 0xffffffff : (0xffffffff << (32 - bits)) >>> 0; var ipn = (p[0] << 24) + (p[1] << 16) + (p[2] << 8) + p[3]; var net = (ipn & mask) >>> 0; var broad = (net | (~mask >>> 0)) >>> 0; function toIp(n) { return [(n >>> 24) & 255, (n >> 16) & 255, (n >> 8) & 255, n & 255].join('.'); } return { net: toIp(net), broad: toIp(broad), first: toIp(net + 1), last: toIp(broad - 1), hosts: bits >= 31 ? 0 : (broad - net - 1) }; };


window.TOOL = { id: "net-cidr-range", n: "CIDR 转范围", c: "network", d: "把 /24 等展开成 IP 区间描述",
  custom: null,
  fields: [{"k":"cidr","t":"CIDR","type":"text","v":"10.0.0.0/24"},{"k":"out","t":"结果","type":"out","dl":1,"mono":1}],
  auto: true,
  first: true,
  init: null,
  run: function (v) { var m = (v.cidr || '').match(/^(\d+\.\d+\.\d+\.\d+)\/(\d+)$/); if (!m) return { out: '', note: '格式如 10.0.0.0/24', warn: true }; var r = Nt.cidr(m[1], +m[2]); return { out: '范围：' + r.first + ' ~ ' + r.last + '\n共 ' + r.hosts + ' 个可用地址' }; } };
var FK='toolbox_fav_v2';
function sy(){try{return JSON.parse(localStorage.getItem(FK)||'[]')}catch(e){return[]}}
var fv=document.getElementById('fv');
function rf(){fv.classList.toggle('on',sy().indexOf("net-cidr-range")>=0)}
rf();fv.onclick=function(){var f=sy(),i=f.indexOf("net-cidr-range");
if(i>=0)f.splice(i,1);else f.push("net-cidr-range");
localStorage.setItem(FK,JSON.stringify(f));rf()};
var UK='toolbox_used_v2';
try{var u=JSON.parse(localStorage.getItem(UK)||'[]');u=u.filter(function(x){return x!=="net-cidr-range"});u.unshift("net-cidr-range");localStorage.setItem(UK,JSON.stringify(u.slice(0,12)))}catch(e){}
RT.boot(window.TOOL);
</script>
