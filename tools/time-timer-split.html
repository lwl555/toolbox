<main class="pane">
<h1 class="tool-title" style="margin-bottom:6px">时段拆分</h1>
<p class="lede">把一整天按 N 段均分，给每段起止时间</p>
<div id="app"></div>
<div class="rel"><h4>同类工具</h4><div class="grid"><a class="card" href="time-now.html"><div class="card-t"><span class="card-name">当前时间戳</span></div><div class="card-desc">显示现在的 Unix 秒/毫秒时间戳</div></a><a class="card" href="time-ts2date.html"><div class="card-t"><span class="card-name">时间戳转日期</span></div><div class="card-desc">把 Unix 时间戳还原成可读日期</div></a><a class="card" href="time-date2ts.html"><div class="card-t"><span class="card-name">日期转时间戳</span></div><div class="card-desc">把日期转成 Unix 时间戳</div></a><a class="card" href="time-diff.html"><div class="card-t"><span class="card-name">日期差值</span></div><div class="card-desc">算两个日期相差多少天/周/月/年</div></a><a class="card" href="time-add.html"><div class="card-t"><span class="card-name">日期加减</span></div><div class="card-desc">在日期上加减天/月/年</div></a><a class="card" href="time-weekday.html"><div class="card-t"><span class="card-name">星期几</span></div><div class="card-desc">查某天是星期几</div></a></div></div>

<script src="../assets/runtime.js"></script>
<script>
/* 时间 / 日期 — 28 个 */
var Th = {};
Th.pad = function (n) { return (n < 10 ? '0' : '') + n; };
Th.fmt = function (d, f) { f = f || 'Y-M-D H:I:S'; var o = { Y: d.getFullYear(), M: Th.pad(d.getMonth() + 1), D: Th.pad(d.getDate()), H: Th.pad(d.getHours()), I: Th.pad(d.getMinutes()), S: Th.pad(d.getSeconds()), w: d.getDay() }; var map = { 'Y年': o.Y + '年', 'M月': o.M + '月', 'D日': o.D + '日' }; return f.replace(/Y|M|D|H|I|S/g, function (c) { return o[c]; }); };
Th.parse = function (s) { s = (s || '').trim(); var m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})(?:[ T](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/); if (!m) return null; return new Date(+m[1], +m[2] - 1, +m[3], m[4] ? +m[4] : 0, m[5] ? +m[5] : 0, m[6] ? +m[6] : 0); };
Th.wk = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
Th.zodiac = function (m, d) { var z = [[1, 20, '水瓶'], [2, 19, '双鱼'], [3, 21, '白羊'], [4, 20, '金牛'], [5, 21, '双子'], [6, 22, '巨蟹'], [7, 23, '狮子'], [8, 23, '处女'], [9, 23, '天秤'], [10, 24, '天蝎'], [11, 23, '射手'], [12, 22, '摩羯']]; for (var i = z.length - 1; i >= 0; i--) { if (m > z[i][0] || (m === z[i][0] && d >= z[i][1])) return z[i][2]; } return '摩羯'; };
Th.sxz = function (y) { var a = ['鼠', '牛', '虎', '兔', '龙', '蛇', '马', '羊', '猴', '鸡', '狗', '猪']; return a[(y - 4) % 12]; };
Th.workdays = function (a, b) { var n = 0, d = new Date(a); while (d <= b) { var w = d.getDay(); if (w !== 0 && w !== 6) n++; d.setDate(d.getDate() + 1); } return n; };
Th.add = function (d, days) { var r = new Date(d); r.setDate(r.getDate() + days); return r; };
Th.addMonths = function (d, m) { var r = new Date(d); r.setMonth(r.getMonth() + m); return r; };


window.TOOL = { id: "time-timer-split", n: "时段拆分", c: "time", d: "把一整天按 N 段均分，给每段起止时间",
  custom: null,
  fields: [{"k":"n","t":"分段数","type":"number","v":4,"min":1,"max":48},{"k":"out","t":"结果","type":"out","dl":1,"mono":1}],
  auto: true,
  first: true,
  init: null,
  run: function (v) { var r = [], step = 1440 / v.n; for (var i = 0; i < v.n; i++) { var s = i * step, e = (i + 1) * step; var sh = Math.floor(s / 60), sm = Math.round(s % 60); var eh = Math.floor(e / 60), em = Math.round(e % 60); r.push(Th.pad(sh) + ':' + Th.pad(sm) + ' - ' + Th.pad(eh) + ':' + Th.pad(em)); } return { out: r.join('\n') }; } };
var FK='toolbox_fav_v2';
function sy(){try{return JSON.parse(localStorage.getItem(FK)||'[]')}catch(e){return[]}}
var fv=document.getElementById('fv');
function rf(){fv.classList.toggle('on',sy().indexOf("time-timer-split")>=0)}
rf();fv.onclick=function(){var f=sy(),i=f.indexOf("time-timer-split");
if(i>=0)f.splice(i,1);else f.push("time-timer-split");
localStorage.setItem(FK,JSON.stringify(f));rf()};
var UK='toolbox_used_v2';
try{var u=JSON.parse(localStorage.getItem(UK)||'[]');u=u.filter(function(x){return x!=="time-timer-split"});u.unshift("time-timer-split");localStorage.setItem(UK,JSON.stringify(u.slice(0,12)))}catch(e){}
RT.boot(window.TOOL);
</script>
</body>
