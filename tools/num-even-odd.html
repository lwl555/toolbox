var Nh = {};
Nh.sum = function (a) { return a.reduce(function (x, y) { return x + y; }, 0); };
Nh.mean = function (a) { return a.length ? Nh.sum(a) / a.length : 0; };
Nh.med = function (a) { if (!a.length) return 0; var b = a.slice().sort(function (x, y) { return x - y; }); var m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };
Nh.mode = function (a) { var m = {}, r = []; a.forEach(function (x) { m[x] = (m[x] || 0) + 1; }); var mx = 0; for (var k in m) if (m[k] > mx) mx = m[k]; if (mx <= 1) return []; for (var k2 in m) if (m[k2] === mx) r.push(+k2); return r; };
Nh.gcd = function (a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = b; b = a % b; a = t; } return a || 1; };
Nh.lcm = function (a, b) { return Math.abs(a * b) / Nh.gcd(a, b); };
Nh.isPrime = function (n) { if (n < 2) return false; for (var i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };
Nh.factor = function (n) { n = Math.abs(n); var r = [], p = 2; while (p * p <= n) { while (n % p === 0) { r.push(p); n /= p; } p++; } if (n > 1) r.push(n); return r; };
Nh.fib = function (n) { if (n < 1) return []; var a = [0, 1], r = [0]; for (var i = 1; i < n; i++) { r.push(a[1]); a = [a[1], a[0] + a[1]]; } return r.slice(0, n); };
Nh.fact = function (n) { if (n > 170) return Infinity; var r = 1; for (var i = 2; i <= n; i++) r *= i; return r; };
Nh.cnNum = function (n) { var d = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'], u = ['', '十', '百', '千'], r = ''; if (n === 0) return '零'; var s = '' + n, i = 0; for (; i < s.length; i++) { var x = +s[i]; if (x) r += d[x] + u[s.length - 1 - i]; else if (r && r[r.length - 1] !== '零') r += '零'; } return r.replace(/零+$/, ''); };
Nh.cnMoney = function (n) {
  if (isNaN(n)) return ''; var neg = n < 0; n = Math.abs(n); var s = (Math.round(n * 100) / 100).toFixed(2), parts = s.split('.'), intp = parts[0], dec = parts[1];
  var d = ['零', '壹', '贰', '叁', '肆', '伍', '陆', '柒', '捌', '玖'], u = ['', '拾', '佰', '仟'], g = ['', '万', '亿'];
  function grp(t) { var r = '', zero = false; for (var i = 0; i < t.length; i++) { var x = +t[i], p = t.length - 1 - i; if (x === 0) { if (!zero && r) zero = true; } else { if (zero) { r += '零'; zero = false; } r += d[x] + u[p % 4]; } } if (zero) r += ''; return r; }
  var str = '', t = intp, gi = 0; while (t.length) { var seg = t.slice(-4); t = t.slice(0, -4); var gv = grp(seg); if (gv) str = gv + g[gi] + str; gi++; }
  if (!str) str = '零';
  var decStr = ''; if (dec[0] !== '0' || dec[1] !== '0') { decStr = d[+dec[0]] + (dec[0] !== '0' ? '角' : '') + (dec[1] !== '0' ? d[+dec[1]] + '分' : ''); }
  else decStr = '整';
  str = (neg ? '负' : '') + str + '元' + (decStr === '整' ? '整' : decStr);
  return str;
};
Nh.roman = function (n) { if (n < 1 || n > 3999) return ''; var m = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]; var r = ''; for (var i = 0; i < m.length; i++) { while (n >= m[i][0]) { r += m[i][1]; n -= m[i][0]; } } return r; };
Nh.romanD = function (s) { var m = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 }, r = 0; for (var i = 0; i < s.length; i++) { var c = m[s[i]], nx = m[s[i + 1]]; if (nx > c) r -= c; else r += c; } return r; };
Nh.parseNums = function (s) { return (s + '').split(/[^\d.\-eE]+/).map(function (x) { return parseFloat(x); }).filter(function (x) { return !isNaN(x); }); };
Nh.fmt = function (n) { return ('' + n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); };
