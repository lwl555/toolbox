<script>
/* 网络 / 环境 — 16 个 */
var Nt = {};
Nt.cidr = function (ip, bits) { var p = ip.split('.').map(Number); var mask = bits === 32 ? 0xffffffff : (0xffffffff << (32 - bits)) >>> 0; var ipn = (p[0] << 24) + (p[1] << 16) + (p[2] << 8) + p[3]; var net = (ipn & mask) >>> 0; var broad = (net | (~mask >>> 0)) >>> 0; function toIp(n) { return [(n >>> 24) & 255, (n >> 16) & 255, (n >> 8) & 255, n & 255].join('.'); } return { net: toIp(net), broad: toIp(broad), first: toIp(net + 1), last: toIp(broad - 1), hosts: bits >= 31 ? 0 : (broad - net - 1) }; };


window.TOOL = { id: "net-timezone", n: "时区详情", c: "network", d: "显示本机时区与 UTC 偏移",
  custom: null,
  fields: [{"k":"cv","t":"时区","type":"custom","html":"<div id=\"tzBox\" style=\"font-size:13px;line-height:1.9\"></div>"}],
  auto: true,
  first: true,
  init: function () { var box = document.getElementById('tzBox'); var tz = Intl.DateTimeFormat().resolvedOptions().timeZone; var off = -new Date().getTimezoneOffset() / 60; var info = [['时区', tz], ['UTC 偏移', 'UTC' + (off >= 0 ? '+' : '') + off], ['本地时间', new Date().toLocaleString()], ['Locale', navigator.language]]; box.innerHTML = info.map(function (r) { return '<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--ink-1);padding:4px 0"><span style="color:var(--ink-3)">' + r[0] + '</span><b>' + RT.esc('' + r[1]) + '</b></div>'; }).join(''); },
  run: function () {} };
var FK='toolbox_fav_v2';
function sy(){try{return JSON.parse(localStorage.getItem(FK)||'[]')}catch(e){return[]}}
var fv=document.getElementById('fv');
function rf(){fv.classList.toggle('on',sy().indexOf("net-timezone")>=0)}
rf();fv.onclick=function(){var f=sy(),i=f.indexOf("net-timezone");
if(i>=0)f.splice(i,1);else f.push("net-timezone");
localStorage.setItem(FK,JSON.stringify(f));rf()};
var UK='toolbox_used_v2';
try{var u=JSON.parse(localStorage.getItem(UK)||'[]');u=u.filter(function(x){return x!=="net-timezone"});u.unshift("net-timezone");localStorage.setItem(UK,JSON.stringify(u.slice(0,12)))}catch(e){}
RT.boot(window.TOOL);
</script>
