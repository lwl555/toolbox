<script>
/* 时间 / 日期 — 28 个 */
var Th = {};
Th.pad = function (n) { return (n < 10 ? '0' : '') + n; };
Th.fmt = function (d, f) { f = f || 'Y-M-D H:I:S'; var o = { Y: d.getFullYear(), M: Th.pad(d.getMonth() + 1), D: Th.pad(d.getDate()), H: Th.pad(d.getHours()), I: Th.pad(d.getMinutes()), S: Th.pad(d.getSeconds()), w: d.getDay() }; var map = { 'Y年': o.Y + '年', 'M月': o.M + '月', 'D日': o.D + '日' }; return f.replace(/Y|M|D|H|I|S/g, function (c) { return o[c]; }); };
Th.parse = function (s) { s = (s || '').trim(); var m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})(?:[ T](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/); if (!m) return null; return new Date(+m[1], +m[2] - 1, +m[3], m[4] ? +m[4] : 0, m[5] ? +m[5] : 0, m[6] ? +m[6] : 0); };
Th.wk = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
Th.zodiac = function (m, d) { var z = [[1, 20, '水瓶'], [2, 19, '双鱼'], [3, 21, '白羊'], [4, 20, '金牛'], [5, 21, '双子'], [6, 22, '巨蟹'], [7, 23, '狮子'], [8, 23, '处女'], [9, 23, '天秤'], [10, 24, '天蝎'], [11, 23, '射手'], [12, 22, '摩羯']]; for (var i = z.length - 1; i >= 0; i--) { if (m > z[i][0] || (m === z[i][0] && d >= z[i][1])) return z[i][2]; } return '摩羯'; };
Th.sxz = function (y) { var a = ['鼠', '牛', '虎', '兔', '龙', '蛇', '马', '羊', '猴', '鸡', '狗', '猪']; return a[(y - 4) % 12]; };
Th.workdays = function (a, b) { var n = 0, d = new Date(a); while (d <= b) { var w = d.getDay(); if (w !== 0 && w !== 6) n++; d.setDate(d.getDate() + 1); } return n; };
Th.add = function (d, days) { var r = new Date(d); r.setDate(r.getDate() + days); return r; };
Th.addMonths = function (d, m) { var r = new Date(d); r.setMonth(r.getMonth() + m); return r; };

tool({ id: 'time-diff', n: '日期差值', c: 'time', d: '算两个日期相差多少天/周/月/年',

tool({ id: 'time-timer-split', n: '时段拆分', c: 'time', d: '把一整天按 N 段均分，给每段起止时间',
  f: [{ k: 'n', t: '分段数', type: 'number', v: 4, min: 1, max: 48 }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1 }],
  run: function (v) { var r = [], step = 1440 / v.n; for (var i = 0; i < v.n; i++) { var s = i * step, e = (i + 1) * step; var sh = Math.floor(s / 60), sm = Math.round(s % 60); var eh = Math.floor(e / 60), em = Math.round(e % 60); r.push(Th.pad(sh) + ':' + Th.pad(sm) + ' - ' + Th.pad(eh) + ':' + Th.pad(em)); } return { out: r.join('\n') }; } });

tool({ id: 'time-age-days', n: '活了多少天', c: 'time', d: '按生日算出生至今的总天数',
  f: [{ k: 'birth', t: '出生日期', type: 'text', ph: '1995-06-15' }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1 }],
  run: function (v) { var b = Th.parse(v.birth); if (!b) return { out: '', note: '格式如 1995-06-15', warn: true }; var days = Math.floor((Date.now() - b) / 86400000); return { out: days + ' 天', metrics: [{ t: '约', v: (days / 365.25).toFixed(2) + ' 年' }, { t: '约小时', v: (days * 24).toLocaleString() }] }; } });

tool({ id: 'time-compare-now', n: '距今多久', c: 'time', d: '算某日期距离现在过去/未来多久',
  f: [{ k: 'dt', t: '日期', type: 'text', ph: '2025-01-01' }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1 }],
  run: function (v) { var d = Th.parse(v.dt); if (!d) return { out: '', note: '格式如 2025-01-01', warn: true }; var diff = Date.now() - d; var past = diff >= 0; var days = Math.floor(Math.abs(diff) / 86400000); var lbl = past ? '前' : '后'; if (days < 1) return { out: '就在今天' }; if (days < 30) return { out: days + ' 天' + lbl }; if (days < 365) return { out: (days / 30.44).toFixed(1) + ' 个月' + lbl }; return { out: (days / 365.25).toFixed(1) + ' 年' + lbl }; } });

tool({ id: 'time-iso-week', n: 'ISO 周日期', c: 'time', d: '输出 ISO 8601 周日期（如 2026-W36-2）',
  f: [{ k: 'dt', t: '日期', type: 'text', v: '2026-09-01' }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1 }],
  run: function (v) { var d = Th.parse(v.dt) || new Date(); var day = (d.getDay() + 6) % 7; var thursday = new Date(d); thursday.setDate(d.getDate() - day + 3); var firstThu = new Date(thursday.getFullYear(), 0, 4); var wk = 1 + Math.floor((thursday - firstThu) / 604800000); return { out: thursday.getFullYear() + '-W' + Th.pad(wk) + '-' + (day + 1) }; } });

tool({ id: 'time-sleep', n: '睡眠时长', c: 'time', d: '算入睡到起床的睡眠小时数',
  f: [{ k: 'a', t: '入睡（如 23:30）', type: 'text', ph: '23:30' }, { k: 'b', t: '起床（如 7:20）', type: 'text', ph: '7:20' }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1 }],
  run: function (v) { function toMin(s) { var p = s.split(':'); return (+p[0]) * 60 + (+p[1]); } var a = toMin(v.a), b = toMin(v.b); var diff = b - a; if (diff <= 0) diff += 1440; return { out: (diff / 60).toFixed(2) + ' 小时', metrics: [{ t: '分钟', v: diff }, { t: '是否达标', v: diff >= 420 ? '充足(≥7h)' : '偏少' }] }; } });


window.TOOL = (function () { var t = (typeof T !== 'undefined') ? T.filter(function (x) { return x.id === "time-zone"; })[0] : null; if (t && !t.fields) t.fields = t.f; return t; })();
if (!window.TOOL) { console.error('tool not found: time-zone'); }
var FK='toolbox_fav_v2';
function sy(){try{return JSON.parse(localStorage.getItem(FK)||'[]')}catch(e){return[]}}
var fv=document.getElementById('fv');
function rf(){fv.classList.toggle('on',sy().indexOf("time-zone")>=0)}
rf();fv.onclick=function(){var f=sy(),i=f.indexOf("time-zone");
if(i>=0)f.splice(i,1);else f.push("time-zone");
localStorage.setItem(FK,JSON.stringify(f));rf()};
var UK='toolbox_used_v2';
try{var u=JSON.parse(localStorage.getItem(UK)||'[]');u=u.filter(function(x){return x!=="time-zone"});u.unshift("time-zone");localStorage.setItem(UK,JSON.stringify(u.slice(0,12)))}catch(e){}
RT.boot(window.TOOL);
