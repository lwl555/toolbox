/* 网络 / 环境 — 16 个 */
var Nt = {};
Nt.cidr = function (ip, bits) { var p = ip.split('.').map(Number); var mask = bits === 32 ? 0xffffffff : (0xffffffff << (32 - bits)) >>> 0; var ipn = (p[0] << 24) + (p[1] << 16) + (p[2] << 8) + p[3]; var net = (ipn & mask) >>> 0; var broad = (net | (~mask >>> 0)) >>> 0; function toIp(n) { return [(n >>> 24) & 255, (n >> 16) & 255, (n >> 8) & 255, n & 255].join('.'); } return { net: toIp(net), broad: toIp(broad), first: toIp(net + 1), last: toIp(broad - 1), hosts: bits >= 31 ? 0 : (broad - net - 1) }; };

tool({ id: 'net-subnet', n: '子网划分计算', c: 'network', d: 'CIDR 算网络地址/广播/可用主机',
  f: [{ k: 'ip', t: 'IP', type: 'text', v: '192.168.1.10' }, { k: 'bits', t: '掩码位', type: 'number', v: 24, min: 0, max: 32 }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1, metrics: 1 }],
  run: function (v) { try { var r = Nt.cidr(v.ip, v.bits); return { out: '网络地址：' + r.net + '\n广播地址：' + r.broad + '\n可用范围：' + r.first + ' ~ ' + r.last, metrics: [{ t: '网络', v: r.net }, { t: '广播', v: r.broad }, { t: '可用主机', v: r.hosts }] }; } catch (e) { return { out: '', note: 'IP 格式有误', warn: true }; } } });

tool({ id: 'net-cidr-range', n: 'CIDR 转范围', c: 'network', d: '把 /24 等展开成 IP 区间描述',
  f: [{ k: 'cidr', t: 'CIDR', type: 'text', v: '10.0.0.0/24' }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1 }],
  run: function (v) { var m = (v.cidr || '').match(/^(\d+\.\d+\.\d+\.\d+)\/(\d+)$/); if (!m) return { out: '', note: '格式如 10.0.0.0/24', warn: true }; var r = Nt.cidr(m[1], +m[2]); return { out: '范围：' + r.first + ' ~ ' + r.last + '\n共 ' + r.hosts + ' 个可用地址' }; } });

tool({ id: 'net-mask', n: '子网掩码换算', c: 'network', d: '掩码与 CIDR 位数互转',
  f: [{ k: 'in', t: '掩码(如 255.255.255.0) 或 /24', type: 'text', v: '255.255.255.0' }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1 }],
  run: function (v) { var s = v.in.trim(); if (s[0] === '/') { var b = +s.slice(1); var mask = (b === 32 ? 0xffffffff : (0xffffffff << (32 - b)) >>> 0); var ip = [(mask >>> 24) & 255, (mask >> 16) & 255, (mask >> 8) & 255, mask & 255].join('.'); return { out: '掩码：' + ip + '（/' + b + '）' }; } var p = s.split('.').map(Number); var n = (p[0] << 24) + (p[1] << 16) + (p[2] << 8) + p[3]; var bits = 0; for (var i = 31; i >= 0; i--) if (n & (1 << i)) bits++; else break; return { out: s + ' 对应 /' + bits }; } });

tool({ id: 'net-domain', n: '域名合法性校验', c: 'network', d: '检查域名格式是否正确',
  f: [{ k: 'in', t: '域名', type: 'text', v: 'example.com' }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1, metrics: 1 }],
  run: function (v) { var re = /^(?=.{1,253}$)([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,}$/i; var ok = re.test(v.in); return { out: ok ? '✓ 合法域名' : '✗ 格式有误', metrics: [{ t: '判断', v: ok ? '合法' : '非法' }, { t: '提示', v: ok ? '' : '如 example.com，不能含下划线/空格' }] }; } });

tool({ id: 'net-email', n: '邮箱合法性校验', c: 'network', d: '检查邮箱格式是否规范',
  f: [{ k: 'in', t: '邮箱', type: 'text', v: 'user@example.com' }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1, metrics: 1 }],

  f: [{ k: 'out', t: '对照表', type: 'out', dl: 1, mono: 1 }], auto: false, run: function () { var P = [[80, 'HTTP'], [443, 'HTTPS'], [21, 'FTP'], [22, 'SSH'], [25, 'SMTP'], [53, 'DNS'], [110, 'POP3'], [143, 'IMAP'], [3306, 'MySQL'], [5432, 'PostgreSQL'], [6379, 'Redis'], [27017, 'MongoDB'], [8080, 'HTTP备用'], [1521, 'Oracle'], [1433, 'SQLServer'], [389, 'LDAP']]; return { out: P.map(function (p) { return p[0] + '  ' + p[1]; }).join('\n') }; } });

tool({ id: 'net-fingerprint', n: '浏览器指纹', c: 'network', d: '综合环境生成简易指纹（仅本机）',
  f: [{ k: 'cv', t: '指纹', type: 'custom', html: '<div id="fpBox" style="font-size:13px"></div><button id="fpCopy" class="btn btn-sec" style="margin-top:8px">复制指纹</button>' }],
  run: function () {}, init: function (RT) { var box = document.getElementById('fpBox'); var raw = navigator.userAgent + '|' + screen.width + 'x' + screen.height + '|' + navigator.language + '|' + (navigator.hardwareConcurrency || 0) + '|' + (navigator.deviceMemory || 0); var fp = (function () { var h = 0; for (var i = 0; i < raw.length; i++) { h = (h * 31 + raw.charCodeAt(i)) >>> 0; } return h.toString(16); })(); var hex = ''; for (var j = 0; j < 16; j++) hex += '0123456789abcdef'[(fp.charCodeAt(j % fp.length) + j) % 16]; box.innerHTML = '<div style="font-family:var(--mono);font-size:15px;word-break:break-all">' + hex + '</div><div style="color:var(--ink-3);margin-top:6px">基于 UA+屏幕+语言+CPU 简易哈希，非精准指纹</div>'; document.getElementById('fpCopy').onclick = function () { RT.copy(hex); }; } });
