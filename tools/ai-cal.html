    var M = { '恋人': ['香水', '首饰', '情侣周边', '手写信+花'], '父母': ['按摩仪', '保暖衣', '养生礼盒', '体检卡'], '朋友': ['盲盒', '香薰', '零食箱', '电影票'], '同事': ['咖啡', '绿植', '笔记本', '茶包'], '孩子': ['绘本', '积木', '画笔', '拼图'] };
    var list = M[v.who] || M['朋友']; var b = v.bug || 200;
    return { out: '预算 ' + b + ' 元，送给' + (v.who || '朋友') + '：\n' + list.join('\n') + '\n（' + (b < 100 ? '精选小物' : b < 500 ? '体面实惠' : '可上档次') + '）' };

  run: function (v) {
    var M = { '通勤': '衬衫/针织+西裤/半裙，简约利落', '约会': '柔和色系+适度点缀，轻松有质感', '运动': '速干运动套装+跑鞋', '聚会': '有设计感的上衣+牛仔，活泼出彩' };
    var S = { '春': '薄外套叠穿', '夏': '透气浅色透气', '秋': '针织开衫+风衣', '冬': '大衣+围巾保暖' };
    return { out: (v.occ || '通勤') + ' · ' + (v.season || '秋') + '：\n' + (M[v.occ] || M['通勤']) + '；' + (S[v.season] || S['秋']) };
  } });

/* 19 卡路里查询 */
tool({ id: 'ai-cal', n: 'AI 卡路里查询', c: 'ai-life', d: '常见食物每 100g 热量。',
  f: [{ k: 'kw', t: '食物', type: 'text' }, { k: 'out', t: '热量', type: 'out' }],
  run: function (v) {
    var k = v.kw || ''; for (var f in FOODS) if (k.indexOf(f) >= 0) return { out: f + '：约 ' + FOODS[f] + ' kcal/100g' };
    return { out: '库内含：' + Object.keys(FOODS).join('、') + '（可查米饭/苹果/鸡胸肉等）' };
  } });

/* 20 生日花/诞生石 */
tool({ id: 'ai-birthstone', n: 'AI 诞生石', c: 'ai-life', d: '按月返回诞生石（趣味）。',
  f: [{ k: 'm', t: '月份', type: 'number', v: 9 }, { k: 'out', t: '结果', type: 'out' }],
  run: function (v) {
    var S = ['石榴石', '紫水晶', '海蓝宝', '钻石', '祖母绿', '珍珠', '红宝石', '橄榄石', '蓝宝石', '碧玺', '黄玉', '绿松石'];
    var F = ['水仙', '紫罗兰', '桃花', '蔷薇', '铃兰', '玫瑰', '芍药', '百合', '雏菊', '桂花', '菊花', '水仙'];
    var i = ((v.m || 9) - 1) % 12; if (i < 0) i = 0;

/* 21 情侣昵称 */
tool({ id: 'ai-cpname', n: 'AI 情侣昵称', c: 'ai-life', d: '生成甜系情侣昵称组合。',
  f: [{ k: 'n', t: '组数', type: 'number', v: 3 }, { k: 'out', t: '昵称', type: 'out' }],
  run: function (v) {
    var A = ['小小', '阿', '老', '小', '大'], B = ['宝贝', '猪猪', '可爱', '甜心', '笨蛋', '憨憨'];
    var o = []; for (var i = 0; i < (v.n || 3); i++) o.push(A[Math.floor(Math.random() * A.length)] + B[Math.floor(Math.random() * B.length)] + ' & ' + A[Math.floor(Math.random() * A.length)] + B[Math.floor(Math.random() * B.length)]);
    return { out: o.join('\n') };

/* 22 许愿 */
tool({ id: 'ai-wish', n: 'AI 许愿瓶', c: 'ai-life', d: '生成一句祝福文案（娱乐）。',
  f: [{ k: 'w', t: '你的愿望', type: 'text' }, { k: 'out', t: '寄语', type: 'out' }],
  run: function (v) { return { out: '愿你「' + (v.w || '心想的事') + '」都能成真。星辰大海，皆为你而来 ✨' }; } });

  f: [{ k: 'birth', t: '生日(YYYY-MM-DD)', type: 'text', v: '1995-05-20' }, { k: 'out', t: '色彩', type: 'out' }],
  run: function (v) {
    var h = hash(v.birth || '1995-05-20'); var C = ['红色·行动派', '蓝色·思考派', '黄色·乐观派', '绿色·平和派', '紫色·浪漫派'];
    return { out: '你的性格色彩：' + C[h % C.length] };

/* 24 取名打分 */
tool({ id: 'ai-name-score', n: 'AI 名字打分', c: 'ai-life', d: '规则近似打分（笔画/谐音，娱乐）。',
  f: [{ k: 'name', t: '名字', type: 'text' }, { k: 'out', t: '评分', type: 'out' }],
  run: function (v) {
    if (!v.name) return { out: '请输入名字' };
    var h = hash(v.name); var sc = 70 + h % 30;
    var bad = ['四', '死', '病', '苦', '亏']; var warn = bad.filter(function (x) { return v.name.indexOf(x) >= 0; }).length ? '（含不吉谐音，建议斟酌）' : '';
    return { out: '「' + v.name + '」评分：' + sc + '/100' + warn };
  } });

tool({ id: 'ai-trip', n: 'AI 旅行计划', c: 'ai-life', d: '按天数与偏好生成行程框架。',
  f: [{ k: 'days', t: '天数', type: 'number', v: 3 }, { k: 'type', t: '类型(休闲/探险/美食/文化)', type: 'text', v: '美食' }, { k: 'out', t: '计划', type: 'out' }],

/* 28 减压建议 */
tool({ id: 'ai-relax', n: 'AI 减压建议', c: 'ai-life', d: '随机给出可执行的减压小动作。',
  f: [{ k: 'out', t: '建议', type: 'out' }],
  run: function (v) {
    var L = ['深呼吸 4-7-8 三次', '起身拉伸肩颈 2 分钟', '闭眼听一首歌', '写下三件今日小确幸', '散步 10 分钟远离屏幕', '喝杯温水发会儿呆', '整理桌面一个小角落'];
