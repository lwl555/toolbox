<script>
/* 学习 / 记忆 — 12 个 */
var Lr = {};
Lr.words = [['apple', '苹果'], ['banana', '香蕉'], ['computer', '电脑'], ['happy', '开心'], ['science', '科学'], ['knowledge', '知识'], ['student', '学生'], ['teacher', '老师'], ['language', '语言'], ['memory', '记忆'], ['practice', '练习'], ['progress', '进步'], ['future', '未来'], ['dream', '梦想'], ['friend', '朋友'], ['family', '家庭'], ['health', '健康'], ['success', '成功'], ['courage', '勇气'], ['wisdom', '智慧'], ['nature', '自然'], ['travel', '旅行'], ['music', '音乐'], ['book', '书'], ['time', '时间'], ['world', '世界'], ['idea', '想法'], ['skill', '技能'], ['goal', '目标'], ['habit', '习惯']];


window.TOOL = { id: "learn-quiz", n: "随机抽题", c: "learn", d: "从题库随机抽 N 道（每行一题）",
  custom: null,
  fields: [{"k":"bank","t":"题库（一行一题）","type":"textarea","rows":8,"ph":"1+1=?\n中国的首都是？"},{"k":"n","t":"抽取数量","type":"number","v":3,"min":1},{"k":"out","t":"结果","type":"out","dl":1,"metrics":1}],
  auto: false,
  first: true,
  init: null,
  run: function (v) { var arr = (v.bank || '').split('\n').map(function (x) { return x.trim(); }).filter(Boolean); if (arr.length < v.n) return { out: '', note: '题库数量不足', warn: true }; for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return { out: arr.slice(0, v.n).map(function (x, i) { return (i + 1) + '. ' + x; }).join('\n'), metrics: [{ t: '抽取', v: v.n + ' 道' }] }; } };
var FK='toolbox_fav_v2';
function sy(){try{return JSON.parse(localStorage.getItem(FK)||'[]')}catch(e){return[]}}
var fv=document.getElementById('fv');
function rf(){fv.classList.toggle('on',sy().indexOf("learn-quiz")>=0)}
rf();fv.onclick=function(){var f=sy(),i=f.indexOf("learn-quiz");
if(i>=0)f.splice(i,1);else f.push("learn-quiz");
localStorage.setItem(FK,JSON.stringify(f));rf()};
var UK='toolbox_used_v2';
try{var u=JSON.parse(localStorage.getItem(UK)||'[]');u=u.filter(function(x){return x!=="learn-quiz"});u.unshift("learn-quiz");localStorage.setItem(UK,JSON.stringify(u.slice(0,12)))}catch(e){}
RT.boot(window.TOOL);
</script>
