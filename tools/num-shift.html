<script>
/* 数字 / 数学 — 32 个 */
var Nh = {};
Nh.sum = function (a) { return a.reduce(function (x, y) { return x + y; }, 0); };
Nh.mean = function (a) { return a.length ? Nh.sum(a) / a.length : 0; };
Nh.med = function (a) { if (!a.length) return 0; var b = a.slice().sort(function (x, y) { return x - y; }); var m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };
Nh.mode = function (a) { var m = {}, r = []; a.forEach(function (x) { m[x] = (m[x] || 0) + 1; }); var mx = 0; for (var k in m) if (m[k] > mx) mx = m[k]; if (mx <= 1) return []; for (var k2 in m) if (m[k2] === mx) r.push(+k2); return r; };
Nh.gcd = function (a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = b; b = a % b; a = t; } return a || 1; };
Nh.lcm = function (a, b) { return Math.abs(a * b) / Nh.gcd(a, b); };
Nh.isPrime = function (n) { if (n < 2) return false; for (var i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };
Nh.factor = function (n) { n = Math.abs(n); var r = [], p = 2; while (p * p <= n) { while (n % p === 0) { r.push(p); n /= p; } p++; } if (n > 1) r.push(n); return r; };
Nh.fib = function (n) { if (n < 1) return []; var a = [0, 1], r = [0]; for (var i = 1; i < n; i++) { r.push(a[1]); a = [a[1], a[0] + a[1]]; } return r.slice(0, n); };
Nh.fact = function (n) { if (n > 170) return Infinity; var r = 1; for (var i = 2; i <= n; i++) r *= i; return r; };
Nh.cnNum = function (n) {
  if (n === 0) return '零';
  var d = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'], u = ['', '十', '百', '千'], g = ['', '万', '亿'];
  var neg = n < 0; n = Math.abs(Math.round(n));
  var s = '' + n, groups = [];
  for (var i = s.length; i > 0; i -= 4) groups.unshift(s.slice(Math.max(0, i - 4), i));
  function groupStr(seg) { var r = '', zero = false; for (var j = 0; j < seg.length; j++) { var x = +seg[j], pos = seg.length - 1 - j; if (x === 0) { if (r && !zero) zero = true; } else { if (zero) { r += '零'; zero = false; } r += d[x] + u[pos]; } } return r; }
  var result = '';
  for (var gi = 0; gi < groups.length; gi++) {
    var seg = groups[gi], gs = groupStr(seg);
    if (gs) { if (result && seg[0] === '0' && !/零$/.test(result)) result += '零'; result += gs + g[groups.length - 1 - gi]; }
  }
  return (neg ? '负' : '') + result;
};
Nh.cnMoney = function (n) {
  if (isNaN(n)) return ''; var neg = n < 0; n = Math.abs(n); var s = (Math.round(n * 100) / 100).toFixed(2), parts = s.split('.'), intp = parts[0], dec = parts[1];
  var d = ['零', '壹', '贰', '叁', '肆', '伍', '陆', '柒', '捌', '玖'], u = ['', '拾', '佰', '仟'], g = ['', '万', '亿'];
  function grp(t) { var r = '', zero = false; for (var i = 0; i < t.length; i++) { var x = +t[i], p = t.length - 1 - i; if (x === 0) { if (!zero && r) zero = true; } else { if (zero) { r += '零'; zero = false; } r += d[x] + u[p % 4]; } } if (zero) r += ''; return r; }
  var str = '', t = intp, gi = 0; while (t.length) { var seg = t.slice(-4); t = t.slice(0, -4); var gv = grp(seg); if (gv) str = gv + g[gi] + str; gi++; }
  if (!str) str = '零';
  var decStr = ''; if (dec[0] !== '0' || dec[1] !== '0') { decStr = d[+dec[0]] + (dec[0] !== '0' ? '角' : '') + (dec[1] !== '0' ? d[+dec[1]] + '分' : ''); }
  else decStr = '整';
  str = (neg ? '负' : '') + str + '元' + (decStr === '整' ? '整' : decStr);
  return str;
};
Nh.roman = function (n) { if (n < 1 || n > 3999) return ''; var m = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]; var r = ''; for (var i = 0; i < m.length; i++) { while (n >= m[i][0]) { r += m[i][1]; n -= m[i][0]; } } return r; };
Nh.romanD = function (s) { var m = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 }, r = 0; for (var i = 0; i < s.length; i++) { var c = m[s[i]], nx = m[s[i + 1]]; if (nx > c) r -= c; else r += c; } return r; };
Nh.parseNums = function (s) { return (s + '').split(/[^\d.\-eE]+/).map(function (x) { return parseFloat(x); }).filter(function (x) { return !isNaN(x); }); };
Nh.fmt = function (n) { return ('' + n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); };

    try { /* eslint-disable no-new-func */ var r = Function('"use strict";return (' + s + ')')(); return { out: String(r), metrics: [{ t: '数值', v: r }] }; } catch (e) { return { out: '', note: '计算失败：' + e.message, warn: true }; }
  } });

tool({ id: 'num-percent', n: '百分比计算', c: 'number', d: '算 A 占 B 的百分之几，或某百分比对应的值',
  f: [{ k: 'a', t: '数值 A', type: 'number', v: 30 }, { k: 'b', t: '数值 B（基数）', type: 'number', v: 200 }, { k: 'out', t: '结果', type: 'out', dl: 1, metrics: 1 }],
  run: function (v) { var b = v.b || 0; if (!b) return { out: '', note: '基数不能为 0', warn: true }; return { out: (v.a / b * 100).toFixed(2) + '%', metrics: [{ t: 'A 占 B', v: (v.a / b * 100).toFixed(2) + '%' }, { t: 'B 的 1%', v: (b / 100).toFixed(4) }] }; } });

tool({ id: 'num-change', n: '增减百分比', c: 'number', d: '算从旧值到新值涨了还是跌了多少',
  f: [{ k: 'old', t: '原值', type: 'number', v: 100 }, { k: 'new', t: '新值', type: 'number', v: 150 }, { k: 'out', t: '结果', type: 'out', dl: 1, metrics: 1 }],
  run: function (v) { if (!v.old) return { out: '', note: '原值不能为 0', warn: true }; var ch = (v.new - v.old) / v.old * 100; var dir = ch >= 0 ? '上涨' : '下降'; return { out: dir + ' ' + Math.abs(ch).toFixed(2) + '%', metrics: [{ t: '变化量', v: (v.new - v.old).toFixed(2) }, { t: '变化率', v: ch.toFixed(2) + '%' }] }; } });

tool({ id: 'num-ratio', n: '比例分配', c: 'number', d: '把总数按给定比例拆分',
  f: [{ k: 'total', t: '总量', type: 'number', v: 100 }, { k: 'ratio', t: '比例（逗号分隔）', type: 'text', v: '3,5,2' }, { k: 'out', t: '分配结果', type: 'out', dl: 1, mono: 1 }],
  run: function (v) { var rs = (v.ratio || '').split(',').map(function (x) { return parseFloat(x); }).filter(function (x) { return !isNaN(x) && x > 0; }); if (!rs.length) return { out: '', note: '请输入比例，如 3,5,2', warn: true }; var sum = Nh.sum(rs); return { out: rs.map(function (r) { return (v.total * r / sum).toFixed(2); }).join('\n') }; } });

tool({ id: 'num-stats', n: '统计汇总', c: 'number', d: '求一组数的总和、均值、中位数、众数、最大最小',
  f: [{ k: 'in', t: '数字列表（空格/逗号分隔）', type: 'textarea', ph: '1 2 3 4 5' }, { k: 'out', t: '统计结果', type: 'out', dl: 1, mono: 1, metrics: 1 }],
  run: function (v) { var a = Nh.parseNums(v.in); if (a.length < 1) return { out: '', note: '请输入至少一个数字', warn: true }; var mo = Nh.mode(a); return { out: '数据个数：' + a.length, metrics: [{ t: '求和', v: Nh.sum(a) }, { t: '均值', v: Nh.mean(a).toFixed(3) }, { t: '中位数', v: Nh.med(a) }, { t: '众数', v: mo.length ? mo.join(', ') : '无' }, { t: '最大', v: Math.max.apply(null, a) }, { t: '最小', v: Math.min.apply(null, a) }, { t: '方差', v: (Nh.sum(a.map(function (x) { return (x - Nh.mean(a)) ** 2; })) / a.length).toFixed(3) }] }; } });

tool({ id: 'num-gcd', n: '最大公约数', c: 'number', d: '求两个数的最大公约数',
  f: [{ k: 'a', t: '数字 A', type: 'number', v: 48 }, { k: 'b', t: '数字 B', type: 'number', v: 36 }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1, metrics: 1 }],
  run: function (v) { return { out: Nh.gcd(v.a, v.b) + '', metrics: [{ t: '最大公约数', v: Nh.gcd(v.a, v.b) }, { t: '最小公倍数', v: Nh.lcm(v.a, v.b) }] }; } });

tool({ id: 'num-lcm', n: '最小公倍数', c: 'number', d: '求两个数的最小公倍数',
  f: [{ k: 'a', t: '数字 A', type: 'number', v: 4 }, { k: 'b', t: '数字 B', type: 'number', v: 6 }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1 }],
  run: function (v) { return { out: Nh.lcm(v.a, v.b) + '', metrics: [{ t: '最小公倍数', v: Nh.lcm(v.a, v.b) }] }; } });

tool({ id: 'num-prime', n: '质数判断', c: 'number', d: '判断一个数是不是质数',

  run: function (v) { if (v.n < 2) return { out: '不是质数（小于 2）' }; return { out: Nh.isPrime(v.n) ? (v.n + ' 是质数 ✓') : (v.n + ' 不是质数'), metrics: Nh.isPrime(v.n) ? [{ t: '判定', v: '质数' }] : [{ t: '可整除', v: '最小因子 ' + (function () { for (var i = 2; i * i <= v.n; i++) if (v.n % i === 0) return i; return v.n; })() }] }; } });

tool({ id: 'num-factor', n: '质因数分解', c: 'number', d: '把一个数拆成质数相乘',

tool({ id: 'num-fib', n: '斐波那契数列', c: 'number', d: '生成前 N 项斐波那契数',

tool({ id: 'num-fact', n: '阶乘计算', c: 'number', d: '算 N 的阶乘（N≤170 不溢出）',

tool({ id: 'num-power', n: '乘方与开方', c: 'number', d: '算 x 的 y 次方，或开 n 次方根',

tool({ id: 'num-log', n: '对数计算', c: 'number', d: '常用对数、自然对数、任意底数对数',

tool({ id: 'num-roman', n: '罗马数字转换', c: 'number', d: '阿拉伯数字与罗马数字互转（1-3999）',
  f: [{ k: 'in', t: '数字 或 罗马串', type: 'text', ph: '2024 或 MMXXIV', v: '2024' }, { k: 'm', t: '方向', type: 'seg', v: 'auto', opts: [{ v: 'auto', t: '自动识别' }, { v: 'a2r', t: '数字→罗马' }, { v: 'r2a', t: '罗马→数字' }] }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1 }],

tool({ id: 'num-cnnum', n: '数字转中文', c: 'number', d: '把阿拉伯数字转成中文小写（一二三…）',

tool({ id: 'num-en', n: '数字转英文', c: 'number', d: '把整数转成英文单词（财务/票据用）',
  f: [{ k: 'n', t: '数字（0-999999）', type: 'number', v: 1024, max: 999999 }, { k: 'out', t: '英文', type: 'out', dl: 1, mono: 1 }],
  run: function (v) {
    var n = Math.round(v.n); if (n < 0 || n > 999999) return { out: '', note: '范围 0-999999', warn: true };
    var o = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
    var t = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
    function two(x) { if (x < 20) return o[x]; var r = t[x / 10 | 0]; if (x % 10) r += '-' + o[x % 10]; return r; }

tool({ id: 'num-seq', n: '数列求和', c: 'number', d: '等差/等比数列前 N 项和',
  f: [{ k: 'a1', t: '首项', type: 'number', v: 1 }, { k: 'd', t: '公差或公比', type: 'number', v: 2 }, { k: 'n', t: '项数', type: 'number', v: 10, min: 1 }, { k: 'm', t: '类型', type: 'seg', v: 'arith', opts: [{ v: 'arith', t: '等差' }, { v: 'geo', t: '等比' }] }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1 }],
  run: function (v) {
    if (v.m === 'arith') return { out: Nh.fmt(Math.round(v.n * (2 * v.a1 + (v.n - 1) * v.d) / 2)) + '', metrics: [{ t: '末项', v: v.a1 + (v.n - 1) * v.d }] };
    if (v.d === 1) return { out: String(v.n * v.a1), metrics: [{ t: '说明', v: '公比为1' }] };
    return { out: Nh.fmt(Math.round(v.a1 * (1 - Math.pow(v.d, v.n)) / (1 - v.d))) + '' };
  } });

tool({ id: 'num-perm', n: '排列组合', c: 'number', d: '算 C(n,k) 组合数与 A(n,k) 排列数',
  f: [{ k: 'n', t: '总数 n', type: 'number', v: 10, min: 0 }, { k: 'k', t: '选取 k', type: 'number', v: 3, min: 0 }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1, metrics: 1 }],
  run: function (v) {
    if (v.k > v.n) return { out: '', note: 'k 不能大于 n', warn: true };
    function f(x) { return Nh.fact(x); }
    var c = f(v.n) / (f(v.k) * f(v.n - v.k)); var a = f(v.n) / f(v.n - v.k);
    return { out: 'C(' + v.n + ',' + v.k + ') = ' + Nh.fmt(c), metrics: [{ t: '组合数 C', v: Nh.fmt(c) }, { t: '排列数 A', v: Nh.fmt(a) }] };
  } });

tool({ id: 'num-round', n: '四舍五入取整', c: 'number', d: '多种进位方式，可指定小数位',
  f: [{ k: 'x', t: '数值', type: 'text', ph: '3.14159' }, { k: 'd', t: '保留小数', type: 'number', v: 2, min: 0, max: 10 }, { k: 'm', t: '方式', type: 'select', opts: [{ v: 'round', t: '四舍五入' }, { v: 'floor', t: '向下取整' }, { v: 'ceil', t: '向上取整' }, { v: 'trunc', t: '直接舍去' }] }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1 }],
  run: function (v) { var x = parseFloat(v.x); if (isNaN(x)) return { out: '', note: '请输入数字', warn: true }; var p = Math.pow(10, v.d || 0); var r = v.m === 'floor' ? Math.floor(x * p) / p : v.m === 'ceil' ? Math.ceil(x * p) / p : v.m === 'trunc' ? Math.trunc(x * p) / p : Math.round(x * p) / p; return { out: (Math.round(r * 1e10) / 1e10) + '' }; } });

tool({ id: 'num-thousand', n: '千分位格式化', c: 'number', d: '给长数字加千位逗号，并可选保留小数',
  f: [{ k: 'x', t: '数字', type: 'text', ph: '1234567.891' }, { k: 'd', t: '小数位', type: 'number', v: 2, min: 0, max: 8 }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1 }],
  run: function (v) { var x = parseFloat((v.x || '').replace(/,/g, '')); if (isNaN(x)) return { out: '', note: '请输入数字', warn: true }; var p = Math.pow(10, v.d || 0); var r = Math.round(x * p) / p; var s = ('' + r), parts = s.split('.'); parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ','); return { out: parts.join('.') }; } });

tool({ id: 'num-range', n: '生成等差序列', c: 'number', d: '生成从起值到终值、指定步长的数列',
  f: [{ k: 'from', t: '起始', type: 'number', v: 1 }, { k: 'to', t: '结束', type: 'number', v: 20 }, { k: 'step', t: '步长', type: 'number', v: 2 }, { k: 'out', t: '序列', type: 'out', dl: 1, mono: 1, metrics: 1 }],
  run: function (v) { var r = [], i = v.from, n = 0; if ((v.to - v.from) * v.step <= 0) return { out: '', note: '步长方向需与起止一致', warn: true }; while ((v.step > 0 && i <= v.to) || (v.step < 0 && i >= v.to)) { r.push(Math.round(i * 1e9) / 1e9); i += v.step; if (++n > 100000) break; } return { out: r.join(', '), metrics: [{ t: '项数', v: r.length }] }; } });

tool({ id: 'num-mod', n: '取余运算', c: 'number', d: '算 a 除以 b 的余数',
  f: [{ k: 'a', t: '被除数', type: 'number', v: 17 }, { k: 'b', t: '除数', type: 'number', v: 5 }, { k: 'out', t: '余数', type: 'out', dl: 1, mono: 1 }],
  run: function (v) { if (!v.b) return { out: '', note: '除数不能为 0', warn: true }; return { out: String(v.a % v.b) }; } });

tool({ id: 'num-shift', n: '位移运算', c: 'number', d: '按位左移 / 右移，看二进制变化',
  f: [{ k: 'a', t: '数值', type: 'number', v: 8, min: 0 }, { k: 'bits', t: '位移位数', type: 'number', v: 2, min: 0, max: 31 }, { k: 'm', t: '方向', type: 'seg', v: 'l', opts: [{ v: 'l', t: '左移 <<' }, { v: 'r', t: '右移 >>' }] }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1, metrics: 1 }],
  run: function (v) { var r = v.m === 'l' ? (v.a << v.bits) : (v.a >> v.bits); return { out: String(r), metrics: [{ t: '二进制', v: r.toString(2) }, { t: v.m === 'l' ? '相当于 ×2^' + v.bits : '相当于 ÷2^' + v.bits, v: r }] }; } });

tool({ id: 'num-bitop', n: '位运算', c: 'number', d: '对两个十进制数做与/或/异或/取反',
  f: [{ k: 'a', t: 'A', type: 'number', v: 12, min: 0 }, { k: 'b', t: 'B', type: 'number', v: 10, min: 0 }, { k: 'op', t: '运算', type: 'select', opts: [{ v: 'and', t: 'AND &' }, { v: 'or', t: 'OR |' }, { v: 'xor', t: 'XOR ^' }, { v: 'not', t: 'NOT ~（仅A）' }] }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1, metrics: 1 }],
  run: function (v) { var r = v.op === 'and' ? (v.a & v.b) : v.op === 'or' ? (v.a | v.b) : v.op === 'xor' ? (v.a ^ v.b) : (~v.a >>> 0); return { out: String(r), metrics: [{ t: 'A 二进制', v: v.a.toString(2) }, { t: 'B 二进制', v: v.b.toString(2) }, { t: '结果二进制', v: r.toString(2) }] }; } });

tool({ id: 'num-rand-range', n: '随机整数', c: 'number', d: '生成指定范围内的随机整数',
  f: [{ k: 'a', t: '最小值', type: 'number', v: 1 }, { k: 'b', t: '最大值', type: 'number', v: 100 }, { k: 'n', t: '生成个数', type: 'number', v: 1, min: 1, max: 200 }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1 }],
  auto: false,
  run: function (v) { var r = []; for (var i = 0; i < (v.n || 1); i++) r.push(Math.floor(Math.random() * (v.b - v.a + 1)) + v.a); return { out: r.join(', '), metrics: [{ t: '范围', v: v.a + ' ~ ' + v.b }] }; } });

tool({ id: 'num-even-odd', n: '奇偶判断', c: 'number', d: '判断一个数是奇数还是偶数',
  f: [{ k: 'n', t: '数字', type: 'number', v: 42 }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1 }],
  run: function (v) { return { out: v.n % 2 === 0 ? (v.n + ' 是偶数') : (v.n + ' 是奇数') }; } });

tool({ id: 'num-divisors', n: '约数枚举', c: 'number', d: '列出一个数的所有正约数',
  f: [{ k: 'n', t: '数字', type: 'number', v: 60, min: 1 }, { k: 'out', t: '约数', type: 'out', dl: 1, mono: 1, metrics: 1 }],
  run: function (v) { var n = Math.abs(Math.round(v.n)), r = []; for (var i = 1; i <= n; i++) if (n % i === 0) r.push(i); return { out: r.join(', '), metrics: [{ t: '约数个数', v: r.length }] }; } });

tool({ id: 'num-palindrome', n: '回文数判断', c: 'number', d: '判断一个正整数是否正读反读都一样',
  f: [{ k: 'n', t: '数字', type: 'number', v: 12321 }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1 }],
  run: function (v) { var s = '' + Math.abs(Math.round(v.n)); var r = s === s.split('').reverse().join(''); return { out: r ? (v.n + ' 是回文数 ✓') : (v.n + ' 不是回文数') }; } });


window.TOOL = (function () { var t = (typeof T !== 'undefined') ? T.filter(function (x) { return x.id === "num-shift"; })[0] : null; if (t && !t.fields) t.fields = t.f; return t; })();
if (!window.TOOL) { console.error('tool not found: num-shift'); }
var FK='toolbox_fav_v2';
function sy(){try{return JSON.parse(localStorage.getItem(FK)||'[]')}catch(e){return[]}}
var fv=document.getElementById('fv');
function rf(){fv.classList.toggle('on',sy().indexOf("num-shift")>=0)}
rf();fv.onclick=function(){var f=sy(),i=f.indexOf("num-shift");
if(i>=0)f.splice(i,1);else f.push("num-shift");
localStorage.setItem(FK,JSON.stringify(f));rf()};
var UK='toolbox_used_v2';
try{var u=JSON.parse(localStorage.getItem(UK)||'[]');u=u.filter(function(x){return x!=="num-shift"});u.unshift("num-shift");localStorage.setItem(UK,JSON.stringify(u.slice(0,24)))}catch(e){}
/* 顶部栏滚动阴影（与首页一致） */
(function(){
  var top=document.querySelector('.tool-top');
  if(!top)return;
  function onS(){top.classList.toggle('scrolled', window.scrollY>4)}
  window.addEventListener('scroll',onS,{passive:true});onS();
})();
RT.boot(window.TOOL);
</script>
