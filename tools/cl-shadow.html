var Cl = {};
Cl.hex2rgb = function (h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(function (x) { return x + x; }).join(''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };
Cl.rgb2hex = function (r, g, b) { function h(x) { return ('0' + Math.round(x).toString(16)).slice(-2); } return '#' + h(r) + h(g) + h(b); };
Cl.rgb2hsl = function (r, g, b) { r /= 255; g /= 255; b /= 255; var mx = Math.max(r, g, b), mn = Math.min(r, g, b), h, s, l = (mx + mn) / 2; if (mx === mn) { h = s = 0; } else { var d = mx - mn; s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn); switch (mx) { case r: h = (g - b) / d + (g < b ? 6 : 0); break; case g: h = (b - r) / d + 2; break; default: h = (r - g) / d + 4; } h /= 6; } return [Math.round(h * 360), Math.round(s * 100), Math.round(l * 100)]; };
Cl.hsl2rgb = function (h, s, l) { s /= 100; l /= 100; var c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2, r = 0, g = 0, b = 0; if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; } else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; } return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)]; };
Cl.relLum = function (r, g, b) { function f(c) { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); } return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b); };
Cl.contrast = function (c1, c2) { var l1 = Cl.relLum.apply(null, c1), l2 = Cl.relLum.apply(null, c2); var hi = Math.max(l1, l2), lo = Math.min(l1, l2); return (hi + 0.05) / (lo + 0.05); };
Cl.mix = function (a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; };
Cl.sw = function (c) { return '<span style="display:inline-block;width:18px;height:18px;border-radius:4px;background:' + Cl.rgb2hex.apply(null, c) + ';vertical-align:middle;margin-right:4px;border:1px solid rgba(0,0,0,.1)"></span>'; };
Cl.scheme = function (hex, type) { var rgb = Cl.hex2rgb(hex), hsl = Cl.rgb2hsl.apply(null, rgb), h = hsl[0], r = []; var adds = { comp: [180], analogic: [-30, 30], triadic: [120, 240], split: [150, 210], tetradic: [90, 180, 270], mono: [0, 0, 0] }; var list = type === 'mono' ? [hsl, [hsl[0], hsl[1], Math.min(95, hsl[2] + 20)], [hsl[0], hsl[1], Math.max(10, hsl[2] - 20)]] : adds[type].map(function (a) { return [((h + a) % 360 + 360) % 360, hsl[1], hsl[2]]; }); list.forEach(function (h2) { r.push(Cl.hsl2rgb.apply(null, h2)); }); return r; };

  f: [{ k: 'in', t: '主色 HEX', type: 'text', v: '#6366f1' }, { k: 'out', t: '色阶', type: 'outhtml' }],
  run: function (v) { try { var rgb = Cl.hex2rgb(v.in); var levels = [['50', 90], ['100', 80], ['200', 65], ['300', 50], ['400', 38], ['500', 25], ['600', 18], ['700', 12], ['800', 6], ['900', 2]]; var html = '<div style="display:flex;flex-wrap:wrap;gap:6px">'; levels.forEach(function (l) { var hsl = Cl.rgb2hsl.apply(null, rgb); hsl[2] = l[1]; var r = Cl.hsl2rgb.apply(null, hsl); var hex = Cl.rgb2hex.apply(null, r); html += '<div style="width:60px;text-align:center"><div style="height:42px;border-radius:8px;background:' + hex + '"></div><div style="font-size:10px">' + l[0] + '</div><div style="font-size:9px;color:var(--ink-3)">' + hex + '</div></div>'; }); return { out: html + '</div>' }; } catch (e) { return { out: '<span class="out-empty">格式有误</span>' }; } } });

tool({ id: 'cl-alpha', n: '透明度叠加', c: 'color', d: '算带 alpha 的颜色叠在白/黑底上的结果',
  f: [{ k: 'in', t: '颜色 HEX', type: 'text', v: '#6366f1' }, { k: 'a', t: '不透明度 %', type: 'number', v: 70, min: 0, max: 100 }, { k: 'out', t: '结果', type: 'outhtml' }],
  run: function (v) { try { var rgb = Cl.hex2rgb(v.in); var t = v.a / 100; function over(bg) { return [rgb[0] * t + bg[0] * (1 - t), rgb[1] * t + bg[1] * (1 - t), rgb[2] * t + bg[2] * (1 - t)]; } var w = over([255, 255, 255]), b = over([0, 0, 0]); return { out: '<div style="display:flex;gap:10px"><div style="text-align:center"><div style="width:50px;height:50px;border-radius:10px;background:' + Cl.rgb2hex.apply(null, w) + ';border:1px solid #ddd"></div><div style="font-size:11px">白底</div></div><div style="text-align:center"><div style="width:50px;height:50px;border-radius:10px;background:' + Cl.rgb2hex.apply(null, b) + '"></div><div style="font-size:11px">黑底</div></div></div>' }; } catch (e) { return { out: '<span class="out-empty">格式有误</span>' }; } } });

tool({ id: 'cl-cssvar', n: 'CSS 变量生成', c: 'color', d: '把一组颜色生成 :root 变量代码',
  f: [{ k: 'in', t: '颜色（每行一个 HEX）', type: 'textarea', ph: '#6366f1\n#ec4899\n#1a6b55' }, { k: 'out', t: 'CSS', type: 'out', dl: 1, mono: 1 }],
  run: function (v) { var cs = (v.in || '').split('\n').map(function (x) { return x.trim(); }).filter(Boolean); if (!cs.length) return { out: '', note: '请输入颜色', warn: true }; var r = ':root {\n'; cs.forEach(function (c, i) { r += '  --color-' + (i + 1) + ': ' + c + ';\n'; }); return { out: r + '}' }; } });

tool({ id: 'cl-temp-export', n: '主题色导出', c: 'color', d: '导出主色+深浅变体的 CSS 主题',
  f: [{ k: 'in', t: '主色 HEX', type: 'text', v: '#6366f1' }, { k: 'out', t: 'CSS', type: 'out', dl: 1, mono: 1 }],
  run: function (v) { try { var rgb = Cl.hex2rgb(v.in); var dark = Cl.rgb2hex.apply(null, Cl.hsl2rgb.apply(null, [(Cl.rgb2hsl.apply(null, rgb)[0]), 70, 18])), light = Cl.rgb2hex.apply(null, Cl.hsl2rgb.apply(null, [Cl.rgb2hsl.apply(null, rgb)[0], 70, 88])); var css = ':root{\n  --primary:' + v.in + ';\n  --primary-dark:' + dark + ';\n  --primary-light:' + light + ';\n}'; return { out: css }; } catch (e) { return { out: '', note: '格式有误', warn: true }; } } });

tool({ id: 'cl-warm-cool', n: '冷暖色调判断', c: 'color', d: '判断颜色偏暖还是偏冷',
  f: [{ k: 'in', t: 'HEX', type: 'text', v: '#ff6600' }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1, metrics: 1 }],
  run: function (v) { try { var rgb = Cl.hex2rgb(v.in); var h = Cl.rgb2hsl.apply(null, rgb)[0]; var warm = h >= 30 && h <= 190 ? '暖色' : '冷色'; return { out: warm, metrics: [{ t: '色相', v: h + '°' }, { t: '倾向', v: warm }] }; } catch (e) { return { out: '', note: '格式有误', warn: true }; } } });

tool({ id: 'cl-distance', n: '颜色差异度', c: 'color', d: '算两个颜色之间的视觉距离（0-100）',
  f: [{ k: 'a', t: '颜色 A', type: 'text', v: '#ff0000' }, { k: 'b', t: '颜色 B', type: 'text', v: '#00ff00' }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1 }],
  run: function (v) { try { var ca = Cl.hex2rgb(v.a), cb = Cl.hex2rgb(v.b); var dist = Math.sqrt(Math.pow(ca[0] - cb[0], 2) + Math.pow(ca[1] - cb[1], 2) + Math.pow(ca[2] - cb[2], 2)); var pct = Math.min(100, dist / 441 * 100); return { out: pct.toFixed(1) + ' / 100', metrics: [{ t: '欧氏距离', v: dist.toFixed(1) }, { t: '差异', v: pct.toFixed(0) + '%' }] }; } catch (e) { return { out: '', note: '格式有误', warn: true }; } } });

tool({ id: 'cl-transparent', n: '透明色生成', c: 'color', d: '把 HEX 加 alpha 转成 8 位十六进制',
  f: [{ k: 'in', t: 'HEX', type: 'text', v: '#6366f1' }, { k: 'op', t: '不透明度 %', type: 'number', v: 50, min: 0, max: 100 }, { k: 'out', t: '结果', type: 'out', dl: 1, mono: 1 }],
  run: function (v) { var a = Math.round(v.op / 100 * 255).toString(16).padStart(2, '0'); return { out: (v.in || '').replace('#', '#') + a }; } });

tool({ id: 'cl-saturate', n: '饱和度调整', c: 'color', d: '调整颜色饱和度并预览',
  f: [{ k: 'in', t: 'HEX', type: 'text', v: '#1a6b55' }, { k: 's', t: '饱和度 %', type: 'number', v: 80, min: 0, max: 100 }, { k: 'out', t: '结果', type: 'outhtml' }],
  run: function (v) { try { var rgb = Cl.hex2rgb(v.in); var hsl = Cl.rgb2hsl.apply(null, rgb); hsl[1] = v.s; var r = Cl.hsl2rgb.apply(null, hsl); var hex = Cl.rgb2hex.apply(null, r); return { out: '<div style="display:flex;align-items:center;gap:10px"><div style="width:50px;height:50px;border-radius:10px;background:' + hex + '"></div><b>' + hex + '</b></div>' }; } catch (e) { return { out: '<span class="out-empty">格式有误</span>' }; } } });
