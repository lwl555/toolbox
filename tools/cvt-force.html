var Ch = {};

Ch.opt = function (obj) { return Object.keys(obj).map(function (k) { return { v: k, t: obj[k].t }; }); };


window.TOOL = { id: "cvt-force", n: "力换算", c: "convert", d: "牛顿/千克力/磅力互转",

  auto: true,
  first: true,
  init: null,
  run: function (v) { var F = {}; Object.keys(FORCE).forEach(function (k) { F[k] = FORCE[k].f; }); return { out: (Math.round(Ch.lin(v.v, v.from, v.to, F) * 1e4) / 1e4) + '' }; } };
var FK='toolbox_fav_v2';

if(i>=0)f.splice(i,1);else f.push("cvt-force");

var UK='toolbox_used_v2';
try{var u=JSON.parse(localStorage.getItem(UK)||'[]');u=u.filter(function(x){return x!=="cvt-force"});u.unshift("cvt-force");localStorage.setItem(UK,JSON.stringify(u.slice(0,12)))}catch(e){}
RT.boot(window.TOOL);
