<h1 class="tool-title" style="margin-bottom:6px">PDF 合并</h1>
<p class="lede">多份 PDF 按顺序合并成一份。</p>
<div id="app"></div>
<div class="rel"><h4>同类工具</h4><div class="grid"><a class="card" href="pdf-split.html"><div class="card-t"><span class="card-name">PDF 拆分单页</span></div><div class="card-desc">每一页导出为独立 PDF 文件。</div></a><a class="card" href="pdf-extract.html"><div class="card-t"><span class="card-name">PDF 提取页</span></div><div class="card-desc">按页码范围导出（如 1,3,5-8）。</div></a><a class="card" href="pdf-remove.html"><div class="card-t"><span class="card-name">PDF 删除页</span></div><div class="card-desc">删除指定页码后导出。</div></a><a class="card" href="pdf-rotate.html"><div class="card-t"><span class="card-name">PDF 旋转页</span></div><div class="card-desc">将所有页面旋转 90/180/270 度。</div></a><a class="card" href="pdf-info.html"><div class="card-t"><span class="card-name">PDF 信息</span></div><div class="card-desc">读取页数。</div></a><a class="card" href="pdf-blank.html"><div class="card-t"><span class="card-name">生成空白 PDF</span></div><div class="card-desc">指定页数生成空白 A4 文档。</div></a></div></div>
</main>
<div class="foot"><div class="foot-in">
<b>超有用的工具箱</b> · PDF 合并<br>
所有处理都在你的浏览器本地完成，文件不会上传到任何服务器 · <a href="../index.html">全部工具</a>
</div></div>
<div id="toast"></div>

<script src="../assets/runtime.js"></script>
<script>
/* ============================================================
   16-pdf.js — PDF 处理（pdf-lib，浏览器本地，零上传）
   ============================================================ */

  
window.TOOL = { id: "pdf-merge", n: "PDF 合并", c: "pdf", d: "多份 PDF 按顺序合并成一份。",
  custom: null,
  fields: [{"k":"files","t":"PDF 文件(多选)","type":"file","multi":true,"accept":".pdf"},{"k":"outfile","t":"输出","type":"outfile"}],
  auto: true,
  first: true,
  init: null,
  run: function (v) {
      if (!v.files || v.files.length < 2) return { note: '请选择至少 2 个 PDF', outfile: [] };
      return RT.lib(RT.CDN.pdfLib).then(function () {
        var P = window.PDFLib; return Promise.all(v.files.map(bufOf)).then(function (bufs) {
          return P.PDFDocument.create().then(function (out) {
            return bufs.reduce(function (p, b) {
              return p.then(function () { return P.PDFDocument.load(b); }).then(function (src) { return src.copyPages(out, src.getPageIndices()).then(function (ps) { ps.forEach(function (pg) { out.addPage(pg); }); }); });
            }, Promise.resolve()).then(function () { return out.save(); });
          }).then(function (bytes) {
            return { outfile: [{ name: 'merged.pdf', blob: new Blob([bytes], { type: 'application/pdf' }), size: bytes.length }] };
          });
        });
      });
    } };
var FK='toolbox_fav_v2';
function sy(){try{return JSON.parse(localStorage.getItem(FK)||'[]')}catch(e){return[]}}
var fv=document.getElementById('fv');
function rf(){fv.classList.toggle('on',sy().indexOf("pdf-merge")>=0)}
rf();fv.onclick=function(){var f=sy(),i=f.indexOf("pdf-merge");
if(i>=0)f.splice(i,1);else f.push("pdf-merge");
localStorage.setItem(FK,JSON.stringify(f));rf()};
var UK='toolbox_used_v2';
try{var u=JSON.parse(localStorage.getItem(UK)||'[]');u=u.filter(function(x){return x!=="pdf-merge"});u.unshift("pdf-merge");localStorage.setItem(UK,JSON.stringify(u.slice(0,12)))}catch(e){}
RT.boot(window.TOOL);
</script>
</body>
