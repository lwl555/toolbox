<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SRT / VTT 互转 - 超有用的工具箱</title>
<meta name="description" content="字幕格式在 SRT 与 WebVTT 间转换。。在线免费使用，文件不上传服务器。">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="tool-top"><div class="tool-top-in">
<a class="back" href="../index.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>返回</a>
<span class="tool-cat">音视频</span>
<button class="tool-fav" id="fv" title="收藏">★</button>
</div></div>
<main class="pane">
<h1 class="tool-title" style="margin-bottom:6px">SRT / VTT 互转</h1>
<p class="lede">字幕格式在 SRT 与 WebVTT 间转换。</p>
<div id="app"></div>
<div class="rel"><h4>同类工具</h4><div class="grid"><a class="card" href="md-audio.html"><div class="card-t"><span class="card-name">音频信息</span></div><div class="card-desc">读取时长 / 类型 / 体积。</div></a><a class="card" href="md-video.html"><div class="card-t"><span class="card-name">视频信息</span></div><div class="card-desc">读取时长 / 分辨率 / 体积。</div></a><a class="card" href="md-tone.html"><div class="card-t"><span class="card-name">生成音调</span></div><div class="card-desc">生成指定频率/时长的正弦音 WAV。</div></a><a class="card" href="md-noise.html"><div class="card-t"><span class="card-name">生成白噪声</span></div><div class="card-desc">生成随机白噪声 WAV，用于助眠/测试。</div></a><a class="card" href="md-beep.html"><div class="card-t"><span class="card-name">蜂鸣器</span></div><div class="card-desc">用 WebAudio 直接播放提示音。</div></a><a class="card" href="md-srt-shift.html"><div class="card-t"><span class="card-name">字幕时间轴偏移</span></div><div class="card-desc">整体平移 SRT 时间码（秒，可负）。</div></a></div></div>
</main>
<div class="foot"><div class="foot-in">
<b>超有用的工具箱</b> · SRT / VTT 互转<br>
所有处理都在你的浏览器本地完成，文件不会上传到任何服务器 · <a href="../index.html">全部工具</a>
</div></div>
<div id="toast"></div>

<script src="../assets/runtime.js"></script>
<script>
/* ============================================================
   18-media.js — 音频 / 视频（元数据 + 本地生成 + 字幕）
   说明：浏览器无法无依赖转码音视频，故此分类聚焦“真实可做的”：
   元数据读取、WAV 音调/白噪声生成、蜂鸣、字幕时间轴处理。
   ============================================================ */

  
window.TOOL = { id: "md-srt-vtt", n: "SRT / VTT 互转", c: "media", d: "字幕格式在 SRT 与 WebVTT 间转换。",
  custom: null,
  fields: [{"k":"file","t":"字幕文件","type":"file","accept":".srt,.vtt,.txt"},{"k":"to","t":"转为","type":"seg","opts":[{"v":"vtt","t":"→ VTT"},{"v":"srt","t":"→ SRT"}],"v":"vtt"},{"k":"out","t":"结果","type":"out","mono":true,"dl":true,"dlName":"subtitle.vtt"}],
  auto: true,
  first: true,
  init: null,
  run: function (v) {
      if (!v.file) return { out: '' };
      return RT.fileToText(v.file).then(function (text) {
        if (v.to === 'vtt') {
          var t = 'WEBVTT\n\n' + text.replace(/\r?\n\r?\n/g, '\n\n').replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2');
          return { out: t, note: '已转 VTT' };
        } else {
          var t2 = text.replace(/^WEBVTT[\s\S]*?\n\n/, '').replace(/(\d{2}:\d{2}:\d{2})\.(\d{3})/g, '$1,$2');
          return { out: t2, note: '已转 SRT' };
        }
      });
    } };
var FK='toolbox_fav_v2';
function sy(){try{return JSON.parse(localStorage.getItem(FK)||'[]')}catch(e){return[]}}
var fv=document.getElementById('fv');
function rf(){fv.classList.toggle('on',sy().indexOf("md-srt-vtt")>=0)}
rf();fv.onclick=function(){var f=sy(),i=f.indexOf("md-srt-vtt");
if(i>=0)f.splice(i,1);else f.push("md-srt-vtt");
localStorage.setItem(FK,JSON.stringify(f));rf()};
var UK='toolbox_used_v2';
try{var u=JSON.parse(localStorage.getItem(UK)||'[]');u=u.filter(function(x){return x!=="md-srt-vtt"});u.unshift("md-srt-vtt");localStorage.setItem(UK,JSON.stringify(u.slice(0,12)))}catch(e){}
RT.boot(window.TOOL);
</script>
</body>
</html>
