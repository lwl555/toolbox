<script>
/* 学习 / 记忆 — 12 个 */
var Lr = {};
Lr.words = [['apple', '苹果'], ['banana', '香蕉'], ['computer', '电脑'], ['happy', '开心'], ['science', '科学'], ['knowledge', '知识'], ['student', '学生'], ['teacher', '老师'], ['language', '语言'], ['memory', '记忆'], ['practice', '练习'], ['progress', '进步'], ['future', '未来'], ['dream', '梦想'], ['friend', '朋友'], ['family', '家庭'], ['health', '健康'], ['success', '成功'], ['courage', '勇气'], ['wisdom', '智慧'], ['nature', '自然'], ['travel', '旅行'], ['music', '音乐'], ['book', '书'], ['time', '时间'], ['world', '世界'], ['idea', '想法'], ['skill', '技能'], ['goal', '目标'], ['habit', '习惯']];


window.TOOL = { id: "learn-flow", n: "流程图", c: "learn", d: "用 节点→下一节点 生成简单流程图",
  custom: null,
  fields: [{"k":"in","t":"每行：节点|下一个","type":"textarea","rows":6,"ph":"开始|处理\n处理|判断\n判断|结束"},{"k":"out","t":"流程图","type":"outhtml"}],
  auto: true,
  first: true,
  init: null,
  run: function (v) {
    var lines = (v.in || '').split('\n').filter(function (l) { return l.trim(); }); var nodes = {}, order = [];
    lines.forEach(function (l) { var p = l.split('|'); var a = p[0].trim(), b = p[1] ? p[1].trim() : ''; if (!nodes[a]) { nodes[a] = { t: a, next: [] }; order.push(a); } if (b && !nodes[b]) { nodes[b] = { t: b, next: [] }; order.push(b); } if (b) nodes[a].next.push(b); });
    var html = '<div style="font-size:13px">'; order.forEach(function (k, i) { var n = nodes[k]; html += '<div style="display:flex;align-items:center;gap:8px"><div style="border:1px solid var(--accent);color:var(--accent);padding:4px 12px;border-radius:8px;font-weight:600">' + RT.esc(n.t) + '</div>'; if (n.next.length) html += '<span style="color:var(--ink-3)">→ ' + n.next.map(function (x) { return RT.esc(x); }).join(', ') + '</span>'; html += '</div>'; });
    return { out: html + '</div>' };
  } };
var FK='toolbox_fav_v2';
function sy(){try{return JSON.parse(localStorage.getItem(FK)||'[]')}catch(e){return[]}}
var fv=document.getElementById('fv');
function rf(){fv.classList.toggle('on',sy().indexOf("learn-flow")>=0)}
rf();fv.onclick=function(){var f=sy(),i=f.indexOf("learn-flow");
if(i>=0)f.splice(i,1);else f.push("learn-flow");
localStorage.setItem(FK,JSON.stringify(f));rf()};
var UK='toolbox_used_v2';
try{var u=JSON.parse(localStorage.getItem(UK)||'[]');u=u.filter(function(x){return x!=="learn-flow"});u.unshift("learn-flow");localStorage.setItem(UK,JSON.stringify(u.slice(0,12)))}catch(e){}
RT.boot(window.TOOL);
</script>
</body>
</html>
